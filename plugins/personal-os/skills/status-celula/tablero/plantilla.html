// ---- Revisión 1 a 1 con cada persona (datos en vivo de Jira) ----
const REV_ESTADOS = /listo para revisi|revisi.n t.cnica|certificaci/i;
let REV = {lane:CFG.revision_inicial||(LANES[0]||{}).id, rows:[], loading:false, err:"", filtro:"todas", at:null, hechos:0};
function catDe(st){ st=st||{}; const c=(st.statusCategory||{}).key; if(c==="done") return "done"; if(REV_ESTADOS.test(st.name||"")) return "revision"; return c==="new"?"porhacer":"encurso"; }
const CATNOM={porhacer:"Por hacer", encurso:"En curso", revision:"En revisión", done:"Terminado (sale de abiertos)"};
const CATCLS={porhacer:"warn", encurso:"", revision:"rev", done:"ok"};
// Flujo de Jira de la organización: los estados van en secuencia y Jira solo deja pasar al siguiente.
// «Llevar hasta» recorre el flujo paso a paso (sin atajos, sin Redefinido ni Pausado) y relee las transiciones después de cada paso.
const FLUJO=[[/^sin iniciar/i,0],[/^an[aá]lisis/i,1],[/^listo para desarrollo/i,2],[/^en desarrollo/i,3],[/^listo para revisi/i,4],[/^en revisi/i,5],[/^certificaci/i,6],[/^listo para implementaci/i,7],[/^tarea en producci|^cerrado|^acta enviada/i,8]];
const FLUJO_NOM=["Sin iniciar","Análisis","Listo para desarrollo","En Desarrollo","Listo para revisión","En revisión técnica","Certificación PO (Analista)","Listo para implementación","Tarea en producción","Cerrado / Completado"];
const rangoFlujo=n=>{ const r=FLUJO.find(([re])=>re.test(String(n||"").trim())); return r?r[1]:-1; };
function optsHasta(actual){ const r=rangoFlujo(actual); const L=FLUJO_NOM.filter(n=>rangoFlujo(n)>r&&n.toLowerCase()!==String(actual||"").toLowerCase());
  return L.length?`<optgroup label="Llevar hasta (recorre el flujo paso a paso)">${L.map(n=>`<option value="h:${esc(n)}">Llevar hasta ${esc(n)}</option>`).join("")}</optgroup>`:""; }
function caminoHasta(actual,destino){ const a=rangoFlujo(actual), d=rangoFlujo(destino); return FLUJO_NOM.filter(n=>{ const r=rangoFlujo(n); return r>a&&r<d; }).concat([destino]); }
async function avanzarHasta(k,destino,log){
  const meta=destino.toLowerCase(), dr=rangoFlujo(destino); const nom=x=>String((x.to||{}).name||x.name||""); let ult=null;
  const p0=await jcall("getJiraIssue",{issueIdOrKey:k, fields:["status"]}); const it=((p0&&p0.issues&&p0.issues.nodes)||[])[0]||p0;
  let actual=(((it||{}).fields||{}).status||{}).name||"";
  for(let paso=0; paso<12&&actual.toLowerCase()!==meta; paso++){
    const t=await jcall("getTransitionsForJiraIssue",{issueIdOrKey:k}); const ts=(t&&t.transitions)||[]; const ar=rangoFlujo(actual);
    const cand=ts.filter(x=>!/redefin|pausad/i.test(nom(x))).map(x=>({x,r:rangoFlujo(nom(x))})).filter(c=>c.r>=0&&c.r>ar&&c.r<=dr);
    let el=null;
    if(cand.length){ const min=Math.min(...cand.map(c=>c.r)); const mins=cand.filter(c=>c.r===min); el=(mins.find(c=>nom(c.x).toLowerCase()===meta)||mins[0]).x; }
    else el=ts.find(x=>nom(x).toLowerCase()===meta)||null;
    if(!el) throw new Error(`${k} quedó en «${actual}»: Jira no ofrece un paso hacia «${destino}» desde ahí.`);
    await jcall("transitionJiraIssue",{issueIdOrKey:k, transition:{id:el.id}});
    actual=nom(el); ult=el; log(`${k} → ${actual}`,true);
  }
  if(actual.toLowerCase()!==meta) throw new Error(`${k} quedó en «${actual}» sin llegar a «${destino}».`);
  return ult;
}
async function cargarRev(){
  if(!MCP){ REV.err="Jira no está disponible en esta vista."; renderRev(); return; }
  const acc=ACC[REV.lane]; REV.loading=true; REV.err=""; REV.rows=[]; REV.hechos=0; renderRev();
  try{
    let token=null, n=0;
    do{
      const inp={jql:`assignee = "${acc}" AND statusCategory != Done AND project in (${PROY_JQL}) ORDER BY duedate ASC`,
        fields:["summary","status","duedate","timeoriginalestimate","customfield_10015","project","priority"], maxResults:100, responseContentFormat:"markdown"};
      if(token) inp.nextPageToken=token;
      const p=await jcall("searchJiraIssuesUsingJql",inp);
      const iss=(p&&p.issues)||{}; const nodes=iss.nodes||iss||[];
      nodes.forEach(x=>{ const f=x.fields||{}; const st=f.status||{};
        REV.rows.push({key:x.key, titulo:f.summary||"", estado:st.name||"", cat:catDe(st), fin:f.duedate||null, ini:f.customfield_10015||null,
          est:f.timeoriginalestimate?Math.round(f.timeoriginalestimate/360)/10:null, proyecto:(f.project||{}).key||x.key.split("-")[0],
          url:JIRA_BROWSE+x.key, lane:REV.lane}); });
      token=(iss.pageInfo&&iss.pageInfo.hasNextPage)?iss.pageInfo.endCursor:null; n++;
    } while(token && n<6);
    REV.at=new Date();
  }catch(e){ REV.err=jiraErr(e); }
  REV.loading=false; renderRev();
}
function revResumen(rows){
  const r={total:0, porhacer:0, encurso:0, revision:0, venc:0, sinFecha:0, sinEst:0, futuro:0, futuroH:0};
  rows=rows.filter(x=>x.cat!=="done"&&x.lane===REV.lane); r.total=rows.length;
  rows.forEach(x=>{ r[x.cat]++; if(x.fin&&x.fin<TODAY) r.venc++; if(!x.fin) r.sinFecha++; if(!x.est) r.sinEst++;
    if(x.cat!=="revision"&&!/pausad/i.test(x.estado)&&x.fin&&x.fin>=TODAY){ r.futuro++; r.futuroH+=Number(x.est||0); } });
  return r;
}
function renderRev(){
  const box=$("revBox"); if(!box) return;
  const sel=LANES.map(l=>`<option value="${l.id}" ${l.id===REV.lane?"selected":""}>${esc(l.nm)}</option>`).join("");
  let html=`<div class="vhead"><h2>Revisión 1 a 1 · ${esc(NOMBRE[REV.lane]||"")}</h2>${fuenteJira()}</div><div class="revtop"><label>Persona <select id="revLane">${sel}</select></label>
    <button class="btn primary" id="revLoad">${REV.loading?"Consultando Jira…":(REV.at?"Volver a traer de Jira":"Traer sus issues de Jira")}</button>
    <span class="sync ${REV.err?"bad":(REV.at?"ok":"")}">${esc(REV.err||(REV.at?"Jira al "+REV.at.toLocaleString("es-CO",{dateStyle:"short",timeStyle:"short"})+(REV.hechos?" · "+REV.hechos+" actualizadas en esta revisión":""):"Sin consultar"))}</span></div>`;
  if(!REV.rows.length){ box.innerHTML=html+`<div class="empty">${REV.loading?"Trayendo lo abierto de "+esc(NOMBRE[REV.lane])+" en "+PROY_TXT+"…":"Elige a la persona y pulsa «Traer sus issues de Jira». Luego abre cada issue y decide ahí mismo."}</div>`; wireRev(); return; }
  const s=revResumen(REV.rows);
  // los indicadores son también los filtros: clic en uno muestra esas issues
  const kp=(f,n,t,c)=>`<button type="button" class="kp ${c||""} ${REV.filtro===f?"on":""}" data-revf="${f}" aria-pressed="${REV.filtro===f}"><b class="mono">${n}</b>${t}</button>`;
  html+=`<div class="revkpi">${kp("todas",s.total,"abiertas en Jira")}${kp("porhacer",s.porhacer,"por hacer")}${kp("encurso",s.encurso,"en curso")}${kp("revision",s.revision,"en revisión o certificación")}${kp("venc",s.venc,"vencidas","crit")}${kp("sinfecha",s.sinFecha,"sin fecha","warn")}${kp("sinest",s.sinEst,"sin estimar","warn")}${kp("futuro",s.futuro,"con fecha a futuro · "+h(s.futuroH)+" h","ok")}</div>
    <div class="revtop"><div class="hint">Lo verde es el trabajo asignado de verdad. Clic en un indicador para filtrar; clic en la fila para abrir la issue, decidir con la persona y pulsar «Actualizar en Jira».</div>
    <div class="revf">${[["pausado","Pausadas"],["hechas","Ya actualizadas en esta revisión"]].map(([k,t])=>`<button class="chipf ${REV.filtro===k?"on":""}" data-revf="${k}">${t}</button>`).join("")}</div></div>`;
  let rows=REV.rows.slice(); const f=REV.filtro;
  if(f==="hechas") rows=rows.filter(x=>x.tocada);
  else { rows=rows.filter(x=>x.cat!=="done"&&x.lane===REV.lane);
    if(f==="venc") rows=rows.filter(x=>x.fin&&x.fin<TODAY); else if(f==="sinfecha") rows=rows.filter(x=>!x.fin);
    else if(f==="sinest") rows=rows.filter(x=>!x.est); else if(f==="futuro") rows=rows.filter(x=>x.cat!=="revision"&&!/pausad/i.test(x.estado)&&x.fin&&x.fin>=TODAY);
    else if(f==="pausado") rows=rows.filter(x=>/pausad/i.test(x.estado)); else if(f!=="todas") rows=rows.filter(x=>x.cat===f); }
  rows.sort((a,b)=>((b.fin&&b.fin<TODAY)-(a.fin&&a.fin<TODAY))||String(a.fin||"9").localeCompare(String(b.fin||"9")));
  html+=`<div class="revtbl"><table><thead><tr><th>Issue</th><th>Estado</th><th>Etapa</th><th>Vence</th><th>Est.</th><th></th></tr></thead><tbody>`+
    (rows.length?rows.map(x=>{ const venc=x.fin&&x.fin<TODAY&&x.cat!=="done";
      return `<tr class="clk ${venc?"venc":""} ${x.tocada?"dec":""}" data-k="${esc(x.key)}" tabindex="0">
        <td><span class="mono">${esc(x.key)}</span><div class="tt">${esc(x.titulo)}</div>${x.tocada?`<div class="nt">${esc(x.tocada)}</div>`:""}</td>
        <td>${esc(x.estado)}</td><td><span class="pill ${CATCLS[x.cat]}">${CATNOM[x.cat]}</span></td>
        <td class="mono ${venc?"red":""}">${x.fin?fmt(x.fin):"sin fecha"}</td><td class="mono">${x.est?h(x.est)+" h":"—"}</td>
        <td><button class="btn sm" data-open="${esc(x.key)}">Abrir</button></td></tr>`; }).join(""):`<tr><td colspan="6" class="empty">Nada en este filtro.</td></tr>`)+
    `</tbody></table></div>`;
  box.innerHTML=html; wireRev();
}
function wireRev(){

  const refresh=()=>{ const p=plan(); const bo0=$("fj-ok"); if(bo0&&bo0.dataset.arm==="1"){ bo0.dataset.arm=""; bo0.classList.remove("arm"); bo0.textContent="Actualizar en Jira"; } $("fj-plan").innerHTML=p.L.length?"<b>Se va a enviar a Jira:</b><ul>"+p.L.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>":'<span class="mini">Cambia algo para habilitar «Actualizar en Jira».</span>'; $("fj-ok").disabled=!p.L.length||!canWrite; };

function fotoIssues(){ const base=Object.keys(FOTO.chunks).sort().flatMap(k=>FOTO.chunks[k].issues||[]);
  if(!Object.keys(DELTA).length) return base; const vistos=new Set();
  const out=base.map(x=>{ if(DELTA[x.k]){ vistos.add(x.k); return DELTA[x.k]; } return x; });
  Object.values(DELTA).forEach(x=>{ if(!vistos.has(x.k)) out.push(x); }); return out; }
function corteTxt(s,fuente){ return s?`<span class="corte">${fuente?"Fuente: "+esc(fuente)+" · ":""}corte ${esc(s)}</span>`:`<span class="corte warn">${fuente?"Fuente: "+esc(fuente)+" · ":""}sin datos todavía</span>`; }
let POR_NOMBRE=""; let IS_OWNER=false;
async function nombreDe(id){ if(!id) return ""; try{ const u=await window.claude.use("user"); if(!u||!u.profiles) return ""; const ps=await u.profiles([id]); return (ps&&ps[id]&&ps[id].name)||""; }catch(e){ return ""; } }

// días HÁBILES transcurridos desde una fecha hasta hoy (sin sábados, domingos ni festivos): así se miden colas, SLA y antigüedad
function diasDesde(s){ if(!s) return null; const d=new Date(String(s).slice(0,10)+"T12:00:00"), fin=new Date(TODAY+"T12:00:00"); if(!(d<fin)) return 0;
  let n=0; d.setDate(d.getDate()+1); while(d<=fin){ const w=d.getDay(); if(w>0&&w<6&&!FESTIVOS.has(iso(d))) n++; d.setDate(d.getDate()+1); } return n; }
const enRev=e=>/^listo para revis|^en revis/i.test(e||"");

// Ancestros de lo que tiene padre (historia, macro…): se sube nivel por nivel para nombrar la tarea máxima enlazada en el modo cliente
async function traerPadres(lista){
  const conocido=new Set(lista.map(x=>x.k)), out={};
  let falt=[...new Set(lista.map(x=>x.pa&&x.pa.k).filter(k=>k&&!conocido.has(k)))];
  for(let nivel=0; nivel<5&&falt.length; nivel++){ const nuevos=[];
    for(let i=0;i<falt.length;i+=50){ const ch=falt.slice(i,i+50);
      try{ const p=await jcall("searchJiraIssuesUsingJql",{jql:"key in ("+ch.join(",")+")",fields:["summary","issuetype","parent"],maxResults:100,responseContentFormat:"markdown"});
        (((p&&p.issues)||{}).nodes||[]).forEach(n=>{ const f=n.fields||{}; out[n.key]={t:f.summary||"", it:(f.issuetype||{}).name||"", pa:f.parent?f.parent.key:null};
          if(f.parent&&!conocido.has(f.parent.key)&&!out[f.parent.key]) nuevos.push(f.parent.key); }); }catch(e){}
      ch.forEach(k=>{ if(!out[k]) out[k]={t:"", it:"", pa:null}; }); }
    falt=[...new Set(nuevos)].filter(k=>!out[k]); }
  return out; }
async function actualizarTodo(){
  const b=$("btnTodo"); if(!MCP){ setSync("Para actualizar hace falta el conector de Atlassian en claude.ai","bad"); return; }
  b.disabled=true; b.textContent="Actualizando…";
  const accs=Object.values(ACC).map(a=>`"${a}"`).join(",");
  traerCalendario(); // en paralelo: las reuniones de Teams del calendario del líder
  const F=["summary","status","assignee","duedate","timeoriginalestimate","updated","created","project","customfield_10015","issuetype","parent"];
  const consultas=[
    `project in (${PROY_CLI_JQL}) AND statusCategory != Done ORDER BY key`,
    ...(PROY_TRANS?[`project = ${PROY_TRANS} AND statusCategory != Done AND assignee in (${accs}) ORDER BY key`]:[]),
    `project in (${PROY_JQL}) AND status = "Listo para implementación" AND assignee in (${accs}) ORDER BY key`,
    `project in (${PROY_JQL}) AND assignee in (${accs}) AND statusCategory = Done AND status != "Listo para implementación" AND updated >= startOfMonth() ORDER BY key`];
  const vistos=new Map(); let err=null;
  try{
    for(const jql of consultas){ let token=null, n=0;
      do{ const inp={jql, fields:F, maxResults:100, responseContentFormat:"markdown"}; if(token) inp.nextPageToken=token;
        const p=await jcall("searchJiraIssuesUsingJql",inp); const iss=(p&&p.issues)||{}; const nodes=iss.nodes||[];
        nodes.forEach(x=>{ if(EV_FUERA_T.has(x.key)) return; const f=x.fields||{}; const st=f.status||{};

// --- Pestaña Status Jira (las 9 columnas del rasero del gerente) ---
let SJ_SEL=null;
function fila9(iss){ const mov=new Date(new Date(TODAY+"T12:00:00").getTime()-30*86400000).toISOString().slice(0,10);
  const f={abiertas:iss.length,con:0,sin:0,dev:0,rev:0,mov:0,venc:0,est:0,fecha:0};
  iss.forEach(i=>{ if(i.p) f.con++; else f.sin++; if(i.e==="En Desarrollo") f.dev++; if(enRev(i.e)) f.rev++; if((i.u||"9")<mov) f.mov++; if(i.s==null) f.est++; if(!i.f) f.fecha++; else if(i.f<TODAY) f.venc++; }); return f; }
function renderStatusJira(){
  const todas=fotoIssues().filter(x=>x.c!=="done"); const M=FOTO.meta;
  const cols=[["abiertas","Abiertas"],["con","Con responsable"],["sin","Sin responsable"],["dev","En Desarrollo"],["rev","En revisión"],["mov","Sin movimiento 30 d"],["venc","Vencidas"],["est","Sin estimación"],["fecha","Sin fecha"]];
  const tabla=(filas)=>`<div class="revtbl"><table><thead><tr><th></th>${cols.map(c=>`<th>${c[1]}</th>`).join("")}</tr></thead><tbody>${filas.map(r=>`<tr class="clk ${r.tot?"tot":""} ${SJ_SEL===r.id?"sel":""}" data-sj="${esc(r.id)}"><td>${esc(r.nm)}${r.warn?` <span class="pill crit">${esc(r.warn)}</span>`:""}</td>${cols.map(c=>`<td class="mono ${c[0]==="venc"&&r.f.venc?"red":""}">${r.f[c[0]]}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  const cli=PROY_CLI.map(p=>({id:"p:"+p, nm:PROY_NM[p]+" ("+p+")", iss:todas.filter(x=>x.pr===p)}));
  cli.push({id:"p:TOT", nm:"Total de los clientes", tot:true, iss:todas.filter(x=>PROY_CLI.includes(x.pr))});
  const cel=CELULA_JIRA.map(([j,n])=>({id:"c:"+j, nm:n, iss:todas.filter(x=>x.p===j)}));
  cel.push({id:"c:TOT", nm:"Total de la célula", tot:true, iss:todas.filter(x=>CELULA_JIRA.some(c=>c[0]===x.p))});
  const ext={}; todas.filter(x=>x.p&&PROY_CLI.includes(x.pr)&&!CELULA_JIRA.some(c=>c[0]===x.p)&&!ANALISTAS_JIRA.includes(x.p)).forEach(x=>{ (ext[x.p]=ext[x.p]||[]).push(x); });
  const exts=Object.entries(ext).map(([p,iss])=>({id:"e:"+p, nm:p, iss})).sort((a,b)=>b.iss.length-a.iss.length);
  const ana=ANALISTAS_JIRA.map(p=>({id:"a:"+p, nm:p, iss:todas.filter(x=>x.p===p)}));
  const huer={id:"h", nm:"Sin responsable ("+PROY_CLI_TXT+")", iss:todas.filter(x=>!x.p&&PROY_CLI.includes(x.pr))};
  const all=[...cli,...cel,...ana,...exts,huer]; all.forEach(r=>{ r.f=fila9(r.iss); if(r.id.startsWith("c:")&&!r.tot&&r.f.dev>3) r.warn="más de 3 En Desarrollo"; });
  const sel=all.find(r=>r.id===SJ_SEL);
  const orden=x=>(x.f&&x.f<TODAY?0:enRev(x.e)?1:x.e==="En Desarrollo"?2:3);
  $("vistaJira").innerHTML=`<div class="vhead"><h2>Indicadores de Jira · los nueve que revisa gerencia</h2>${fuenteJira()}</div>
    <div class="hint">Las cifras se calculan aquí desde las issues de Jira: abiertas = todo lo que no está en un estado terminado. «Listo para implementación» y «Redefinido» Jira los cuenta como terminados y no aparecen aquí (Publicar está en Colas).</div>
    <h3>Proyectos de los clientes</h3>${tabla(cli)}
    <h3>Tu célula (todas sus issues abiertas en ${PROY_TXT})</h3>${tabla(cel)}
    <h3>Analista y jefatura</h3>${tabla(ana)}
    <h3>Otras personas que cargan ${PROY_CLI_TXT} (no son de la célula)</h3>${exts.length?tabla(exts):'<div class="mini">Ninguna.</div>'}
    <h3>Sin responsable</h3>${tabla([huer])}
    ${sel?`<section class="sjlist"><h3>${esc(sel.nm)} · ${sel.iss.length} abiertas</h3><ul class="ilist">${sel.iss.slice().sort((a,b)=>orden(a)-orden(b)||String(a.f||"9").localeCompare(String(b.f||"9"))).map(x=>`<li data-fk="${esc(x.k)}"><span class="mono">${esc(x.k)}</span> ${esc(x.t)} <span class="pill">${esc(x.e)}</span> <span class="mini ${x.f&&x.f<TODAY?"red":""}">${x.f?"vence "+fmt(x.f):"sin fecha"}</span>${x.s!=null?` <span class="mini">${h(x.s)} h</span>`:""}</li>`).join("")}</ul></section>`:'<div class="mini">Clic en una fila para ver sus issues; clic en una issue para abrir su ficha.</div>'}`;
  document.querySelectorAll("[data-sj]").forEach(tr=>tr.onclick=()=>{ SJ_SEL=SJ_SEL===tr.dataset.sj?null:tr.dataset.sj; renderStatusJira(); });
  wireFk($("vistaJira"));
}

  const hechas=I.filter(x=>x.c==="done"&&!/listo para implementaci/i.test(x.e)); const porP={}; hechas.forEach(x=>{ (porP[x.p]=porP[x.p]||[]).push(x); });

  $("vistaColas").innerHTML=html;
  document.querySelectorAll("[data-cola]").forEach(tr=>{ tr.setAttribute("aria-expanded","false"); tr.onclick=()=>{ const d=document.querySelector(`[data-det="${CSS.escape(tr.dataset.cola)}"]`); if(d){ d.hidden=!d.hidden; tr.setAttribute("aria-expanded",String(!d.hidden)); } }; });

// --- Bandeja de decisiones (privada): la revisión del correo cada 2 h deja aquí tarjetas en privado/bandeja_* ---
let BANDEJA=[]; let BJ_FILTRO="decidir"; const BJ_ABIERTO={};
const BJ_CLASE={error:"Error reportado",requerimiento:"Requerimiento",compromiso:"Compromiso con fecha",avance:"Avance o informe",consulta:"Consulta o pedido",seguimiento:"Seguimiento"};
const BJ_ACC={crear_issue:"Crear issue en Jira",alcance:"Nota de alcance con hitos",conocimiento:"Documentar en la base de conocimiento",responder:"Borrador de respuesta",seguimiento:"Hacer seguimiento"};
const BJ_EST={nueva:"Por decidir",ajustar:"Ajuste pedido",aprobada:"Aprobada, en cola",hecha:"Hecha",descartada:"Descartada",error:"Con error"};
function bjGrupo(c){ const e=c.estado||"nueva"; if(e==="nueva"||e==="error") return "decidir"; if(e==="aprobada"||e==="ajustar") return "cola"; return e==="hecha"?"hechas":"descartadas"; }
async function bjGuardar(id,cambios){ const cur=BANDEJA.find(x=>x._id===id); if(!cur||!db) return; const nx=Object.assign({},cur,cambios,{decidido:new Date().toISOString()}); delete nx._id;
  Object.assign(cur,cambios); renderBandeja(); try{ await db.collection("privado").doc(id).set(nx); }catch(e){ cur._err="No se pudo guardar: "+(e&&e.message||"error"); renderBandeja(); } }
function bjFh(s){ if(!s) return ""; try{ return new Date(s).toLocaleString("es-CO",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); }catch(e){ return s; } }
function renderBandeja(){
  const root=$("vistaBandeja"); if(!root) return;
  if(!IS_OWNER){ root.innerHTML=`<div class="vhead"><h2>Bandeja</h2></div><div class="empty">Esta pestaña es privada del líder.</div>`; return; }
  const n={decidir:0,cola:0,hechas:0,descartadas:0}; BANDEJA.forEach(c=>n[bjGrupo(c)]++);
  const ult=BANDEJA.reduce((m,c)=>c.creado>m?c.creado:m,"");
  const ord={hoy:0,semana:1,normal:2};
  const lista=BANDEJA.filter(c=>bjGrupo(c)===BJ_FILTRO).sort((a,b)=>(ord[a.urgencia]??2)-(ord[b.urgencia]??2)||String(b.creado).localeCompare(String(a.creado)));

// Carga diaria de una persona con la misma regla del Gantt: la estimación repartida en los días de la barra, más sus reuniones.
function cargaDe(laneId, all, jr){
  const load=new Array(DAYS.length).fill(0); load.sin=new Array(DAYS.length).fill(0); // sin: tareas sin estimar ese día
  all.forEach(e=>{ const ln=e.soloVista?e.laneVista:e.lane; if(!e.placed||ln!==laneId||e.completada||e.soloVista) return;
    const a=dayIdx(e.ini), b=Math.max(a,dayIdx(e.fin2)), n=diasHab(a,b); for(let i=a;i<=b;i++){ if(FESTIVOS.has(DAYS[i])||(e.entregada&&DAYS[i]>e.entregaDia)) continue; if(e.est) load[i]+=e.est/n; else load.sin[i]++; } });
  reunionesDe(laneId,jr,true).forEach(m=>{ const i=DAYS.indexOf(m.dia); if(i>=0) load[i]+=m.h; });
  return load; }

function detectarProblemas(all){ const P={}, porTit={};

// ---- Cambios para Jira ----
// soloJira: solo lo que de verdad falta escribir en Jira (responsable, fechas, estimación, issues por crear); sin notas ni prioridades del plan
function cambios(soloJira){
  const out=[];
  allKeys().forEach(k=>{ const p=PLAN[k]; if(!p) return; const e=eff(k), b=BASE[k]||{};
    if(p.creada) return;
    if(p.descartado){ if(soloJira) return; out.push({key:k, txt:`${k} · ${(e.titulo||"").slice(0,70)}\n   ${p.externo?"no es de la célula: es de "+p.externo.nombre:"descartada del plan"}${p.nota?" · "+p.nota:""}`}); return; }
    if(p.nueva){ out.push({key:k, txt:`CREAR ISSUE · "${e.titulo}" · responsable: ${NOMBRE[e.lane]||"—"} · ${e.placed?fmt(e.ini)+" a "+fmt(e.fin2):"sin fecha"} · est: ${e.est?h(e.est)+" h":"sin estimar"}${e.prio?" · P"+e.prio:""}${e.notaPlan?" · "+e.notaPlan:""}`}); return; }
    const L=[];
    if(k.startsWith("L-")){ if(e.placed) out.push({key:k, txt:`${e.titulo}: ${NOMBRE[e.lane]} del ${fmt(e.ini)} al ${fmt(e.fin2)}${e.prio?" · P"+e.prio:""}`}); return; }
    const jl=isCola(b.grupo)?(b.duenoDev||""):(b.lane||""); // en Jira el responsable de algo en cola sigue siendo el dev
    if((p.lane!==undefined)&&p.lane!==jl) L.push(`responsable: ${NOMBRE[jl]||"—"} → ${NOMBRE[p.lane]||"—"}`);
    if(e.placed&&!e.fromJira){ if(e.fin2!==b.fin) L.push(`vence: ${fmt(b.fin)} → ${e.fin2>LAST?"después del "+fmt(LAST):fmt(e.fin2)}`); if(e.ini!==b.inicio) L.push(`inicio: ${fmt(b.inicio)} → ${fmt(e.ini)}`); }
    if(p.quitado&&b.fin) L.push("sacada del plan (quitar la fecha o moverla)");
    // Jira manda en la estimación: solo queda pendiente si Jira no tiene ninguna y el plan sí
    const estJ=b.estDev!=null?b.estDev:b.est; if(p.est!==undefined&&p.est!==null&&p.est!==""&&estJ==null) L.push(`estimación: sin → ${h(p.est)} h`);
    if(p.prio&&!soloJira) L.push("prioridad P"+p.prio);
    if(p.nota&&!soloJira) L.push("nota: "+p.nota);
    if(L.length) out.push({key:k, txt:`${k} · ${(e.titulo||"").slice(0,70)}\n   ${L.join(" · ")}`});
  });
  return out;
}
// Descartar un cambio = borrar lo que el plan tiene de esa issue: vuelve a lo que dice Jira. Un solo «Deshacer» para todo el lote.
async function descartarCambios(keys){
  const prevs=keys.filter(k=>PLAN[k]).map(k=>[k,JSON.parse(JSON.stringify(PLAN[k]))]); if(!prevs.length) return;
  await Promise.all(prevs.map(([k])=>borrar(k,true)));
  avisoDeshacer(prevs.length===1?"Cambio de "+prevs[0][0]+" descartado":prevs.length+" cambios descartados", async ()=>{
    for(const [k,doc] of prevs){ PLAN[k]=doc;
      if(db){ try{ await db.collection("plan").doc(safeId(k)).set(Object.assign({key:k},doc)); }catch(e){ setSync("No se pudo restaurar: "+(e&&e.message||"error"),"bad"); } } }
    if(!db) saveLocal(); render(); if($("ccards")) abrirCambios(); });
  if($("ccards")) abrirCambios();
}

// Célula y organización van a la colección «config» (la leen todos, solo el dueño escribe) y se aplican al recargar.
// Extras y motor van a «privado» (solo el dueño): los usa la skill la próxima vez que regenera el tablero.
const CF_PRIV={}; let CF=null, CF0="", CF_SUCIO=false, CF_MSG="", CF_MSG_OK=false, CF_ERR=[], CF_BUSCA=null, CF_LISTO=false;
const CF_ABIERTAS=new Set(["pagina","equipo"]); const CF_NUEVOS=new WeakSet();
const cfClon=o=>JSON.parse(JSON.stringify(o==null?null:o));
const CF_ETQ={normal:"Jornada lunes a jueves", viernes:"Jornada viernes", efectiva_normal:"Horas efectivas lunes a jueves", efectiva_viernes:"Horas efectivas viernes", horas_por_dia_estimadas:"Horas estimables por día"};
function cfDesdeActiva(){ const A=window.__CFG_ACTIVA||{}; const sm=o=>{ const c=cfClon(o||{}); delete c._meta; return c; };
  return { celula:cfClon(A.celula||CFG), organizacion:cfClon(A.organizacion||{}),
    extras:CF_PRIV.config_extras?sm(CF_PRIV.config_extras):cfClon(A.extras||{comprometido:{},manuales:[]}),
    motor:CF_PRIV.config_motor?sm(CF_PRIV.config_motor):cfClon(A.motor||{}) }; }
function cfGet(p){ return p.split(".").reduce((o,k)=>o==null?undefined:o[k], CF); }
function cfSet(p,v){ const ks=p.split("."); let o=CF;
  for(let i=0;i<ks.length-1;i++){ const k=ks[i]; if(o[k]==null||typeof o[k]!=="object") o[k]=/^\d+$/.test(ks[i+1])?[]:{}; o=o[k]; }
  const k=ks[ks.length-1]; if(v===undefined){ if(!Array.isArray(o)) delete o[k]; } else o[k]=v; }
function cfValor(el){ const t=el.dataset.t, x=el.value;
  if(t==="chk") return el.checked?true:undefined;
  if(t==="mod") return el.checked?undefined:false;            // los módulos están encendidos salvo que digan false
  if(t==="num"){ const s=x.trim().replace(",","."); if(s==="") return undefined; const n=Number(s); return Number.isFinite(n)?n:s; }
  if(t==="lista"){ const a=x.split(/[,\n]/).map(s=>s.trim()).filter(Boolean); return a.length?a:undefined; }
  if(t==="fechas"){ const a=x.split(/[\s,;]+/).map(s=>s.trim()).filter(Boolean); return a.length?a:undefined; }
  if(t==="json"){ if(!x.trim()) return undefined; return JSON.parse(x); }
  const s=t==="area"?x.replace(/\s+$/,""):x.trim(); return s===""?undefined:s; }
function cfCampo(t,p,lab,o){ o=o||{}; const v=cfGet(p); const ay=o.ayuda?`<small>${esc(o.ayuda)}</small>`:"";
  const ph=o.ph?` placeholder="${esc(o.ph)}"`:""; const ro=o.ro?` readonly title="${esc(o.ro)}"`:"";
  if(t==="chk"||t==="mod"){ const on=t==="mod"?v!==false:!!v; return `<label class="cf-c"><input type="checkbox" data-p="${p}" data-t="${t}" ${on?"checked":""}> <span>${esc(lab)}</span>${ay}</label>`; }
  let inp;
  if(t==="area"||t==="fechas"||t==="json"){ const val=t==="fechas"?(v||[]).join("\n"):t==="json"?JSON.stringify(v==null?(o.vacio===undefined?null:o.vacio):v,null,2):(v==null?"":v);
    inp=`<textarea data-p="${p}" data-t="${t}" rows="${o.filas||3}"${ph}>${esc(val)}</textarea>`; }
  else if(t==="sel"){ const op=(o.vacia?[["",o.vacia]]:[]).concat(o.opts||[]);
    inp=`<select data-p="${p}" data-t="sel">${op.map(([k,n])=>`<option value="${esc(k)}" ${String(v==null?"":v)===String(k)?"selected":""}>${esc(n)}</option>`).join("")}</select>`; }
  else { const val=t==="lista"?(v||[]).join(", "):t==="num"?(v==null?"":String(v).replace(".",",")):(v==null?"":v);
    inp=`<input data-p="${p}" data-t="${t}"${t==="num"?' inputmode="decimal"':""}${o.tipo?` type="${o.tipo}"`:""} value="${esc(val)}"${ph}${ro}>`; }
  return `<label class="cf-f${o.ancho?" cf-"+o.ancho:""}"><span>${esc(lab)}${o.req?' <i class="cf-req" aria-label="obligatorio">*</i>':""}</span>${inp}${ay}</label>`; }

function cfFilas(p,cols,nuevo,o){ o=o||{}; const a=cfGet(p)||[];
  const filas=a.map((x,i)=>`<div class="cf-fila"><div class="cf-fh"><b>${esc((o.titulo&&o.titulo(x,i))||("Fila "+(i+1)))}</b><span class="cf-acts">
      <button class="btn sm" data-acc="subir" data-lista="${p}" data-i="${i}" ${i?"":"disabled"} aria-label="Subir">↑</button><button class="btn sm" data-acc="bajar" data-lista="${p}" data-i="${i}" ${i<a.length-1?"":"disabled"} aria-label="Bajar">↓</button><button class="btn sm danger" data-acc="quitar" data-lista="${p}" data-i="${i}">Quitar</button></span></div>
    <div class="cf-grid">${cols.map(c=>cfCampo(c.t||"txt",`${p}.${i}.${c.k}`,c.lab,Object.assign({},c,{ro:c.ro&&c.ro(x)?c.ro(x):""}))).join("")}</div>${o.extra?o.extra(x,i):""}</div>`).join("");
  return `<div class="cf-filas">${filas||`<div class="empty">${esc(o.vacio||"Sin filas todavía.")}</div>`}</div><button class="btn sm" data-acc="agregar" data-lista="${p}" data-nuevo="${esc(JSON.stringify(nuevo))}">+ ${esc(o.agregar||"Agregar")}</button>`; }
// Mapa clave → valor (nombres de proyecto, clientes, lo prometido): la clave se puede renombrar.
function cfMapa(p,cols,nuevo,o){ o=o||{}; const m=cfGet(p)||{};
  const filas=Object.keys(m).map(k=>`<div class="cf-fila"><div class="cf-grid">
      <label class="cf-f"><span>${esc(o.clave||"Clave")}</span><input class="cf-k" data-mapa="${p}" data-k="${esc(k)}" value="${esc(k)}"></label>
      ${cols?cols.map(c=>cfCampo(c.t||"txt",`${p}.${k}.${c.k}`,c.lab,c)).join(""):cfCampo(o.t||"txt",`${p}.${k}`,o.valor||"Valor",{ancho:"ancho"})}
    </div><div class="cf-acts"><button class="btn sm danger" data-acc="quitar-k" data-mapa="${p}" data-k="${esc(k)}">Quitar</button></div></div>`).join("");
  return `<div class="cf-filas">${filas||`<div class="empty">${esc(o.vacio||"Nada todavía.")}</div>`}</div><button class="btn sm" data-acc="agregar-k" data-mapa="${p}" data-nuevo="${esc(JSON.stringify(nuevo))}">+ ${esc(o.agregar||"Agregar")}</button>`; }
function cfSlug(nm,ocupados){ const b=String(nm||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().replace(/[^a-z0-9 ]/g,"").trim().split(/\s+/)[0]||"persona";
  let s=b, n=2; while(ocupados.has(s)) s=b+(n++); return s; }
function cfValidar(C){ const e=[]; const c=C.celula||{}, o=C.organizacion||{}; const req=(x,m)=>{ if(!x) e.push(m); };
  const num=x=>typeof x==="number"&&Number.isFinite(x);
  req(c.pagina&&c.pagina.titulo,"Página: falta el título.");
  const lanes=Array.isArray(c.lanes)?c.lanes:[]; req(lanes.length,"Equipo: agrega al menos una persona.");
  const ids=new Set();
  lanes.forEach((l,i)=>{ const n=l.nm||("persona "+(i+1));
    if(!l.nm) e.push(`Equipo · persona ${i+1}: falta el nombre.`);
    if(!l.id||!/^[a-z0-9_-]+$/.test(l.id)) e.push(`Equipo · ${n}: el identificador va en minúsculas, sin espacios ni tildes.`);
    else if(ids.has(l.id)) e.push(`Equipo: el identificador «${l.id}» está repetido.`);
    ids.add(l.id);
    if(l.correo&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(l.correo)) e.push(`Equipo · ${n}: el correo no parece válido.`);
    ["celula","analista"].forEach(k=>{ if(l[k]!=null&&!num(l[k])) e.push(`Equipo · ${n}: el orden «${k}» debe ser un número.`); }); });
  req(c.nombres&&c.nombres.lider,"Equipo: falta el nombre corto del líder (para los textos).");
  const r=c.roles||{}; [["lider","quien revisa (líder)"],["certifica","quien certifica"]].forEach(([k,t])=>{ if(r[k]&&!ids.has(r[k])) e.push(`Equipo: «${t}» apunta a alguien que ya no está en el equipo.`); });
  if(c.revision_inicial&&!ids.has(c.revision_inicial)) e.push("Equipo: la persona con la que abre Revisión 1 a 1 ya no está en el equipo.");
  (c.carriles_movil||[]).forEach(id=>{ if(!ids.has(id)) e.push(`Equipo: «${id}» está en los carriles del celular pero ya no está en el equipo.`); });
  const j=c.jira||{};
  req(j.cloud,"Jira: falta el cloudId."); req(j.servidor_mcp,"Jira: falta el nombre del conector.");
  req((j.proyectos_cliente||[]).length,"Jira: falta al menos un proyecto del cliente.");
  req((j.proyectos_crear||[]).length,"Jira: falta al menos un proyecto donde crear tareas.");
  if(j.sitio&&!/^https:\/\/[^\/\s]+/.test(j.sitio)) e.push("Jira: el sitio debe empezar por https://");
  req(c.m365&&c.m365.servidor_mcp,"Microsoft 365: falta el nombre del conector.");
  const jo=c.jornada||{}; Object.keys(CF_ETQ).forEach(k=>{ if(!(num(jo[k])&&jo[k]>=0&&jo[k]<=24)) e.push(`Calendario: «${CF_ETQ[k]}» debe ser un número de horas.`); });
  const s=c.sla||{}; [["revisar","Revisar"],["certificar","Certificar"],["publicar","Publicar"]].forEach(([k,t])=>{ if(!(num(s[k])&&s[k]>=0)) e.push(`Calendario: el SLA de «${t}» debe ser un número de días.`); });
  req(c.ia&&c.ia.contexto,"Asistente: falta el contexto de la célula.");
  (c.festivos||[]).forEach(f=>{ if(!/^\d{4}-\d{2}-\d{2}$/.test(f)||isNaN(new Date(f+"T12:00:00"))) e.push(`Calendario: «${f}» no es una fecha AAAA-MM-DD.`); });
  Object.entries(c.clientes||{}).forEach(([k,v])=>{ if(!v||!v.nm) e.push(`Clientes · ${k}: falta el nombre.`); if(v&&v.re){ try{ new RegExp(v.re,"i"); }catch(_){ e.push(`Clientes · ${k}: el patrón de texto no es válido.`); } } });
  if(c.sprints!=null&&!Array.isArray(c.sprints)) e.push("Sprint: las reservas deben ser una lista.");
  req(o.nombre&&o.pie&&o.logo&&o.logo.src,"Organización: faltan el nombre, el pie o el logo.");
  if(o.logo&&o.logo.src&&o.logo.src.length>180000) e.push("Organización: el logo pesa demasiado (máximo unos 130 KB).");
  const m=C.motor||{};
  if(m.capacidad_factor!=null&&!(num(m.capacidad_factor)&&m.capacidad_factor>0&&m.capacidad_factor<=1)) e.push("Motor: el factor de capacidad va entre 0 y 1 (por ejemplo 0,8).");
  ["sla_revision","sla_implementacion","limite_wip"].forEach(k=>{ if(m[k]!=null&&!num(m[k])) e.push(`Motor: «${k}» debe ser un número.`); });
  ((C.extras||{}).manuales||[]).forEach((x,i)=>{ if(!x.key||!x.titulo) e.push(`Extras · pendiente ${i+1}: faltan la clave o el título.`); if(x.persona&&!ids.has(x.persona)) e.push(`Extras · ${x.key||i+1}: la persona «${x.persona}» no está en el equipo.`); });
  return e; }

  box.addEventListener("toggle",ev=>{ const d=ev.target; if(d&&d.dataset&&d.dataset.sec){ if(d.open) CF_ABIERTAS.add(d.dataset.sec); else CF_ABIERTAS.delete(d.dataset.sec); } },true);
  box.addEventListener("input",ev=>{ const el=ev.target; if(!el.dataset||!el.dataset.p) return; const t=el.dataset.t;
    if(["chk","mod","sel","json","logo"].includes(t)) return;
    cfSet(el.dataset.p,cfValor(el)); CF_MSG=""; cfBarra(); });
  box.addEventListener("change",ev=>{ const el=ev.target; const ds=el.dataset||{};
    if(ds.t==="logo"){ const f=el.files&&el.files[0]; if(!f) return;
      if(f.size>130000){ CF_MSG="El logo pesa "+Math.round(f.size/1024)+" KB; usa uno de 130 KB o menos (mejor SVG o PNG optimizado)."; CF_MSG_OK=false; rr(); return; }
      const fr=new FileReader(); fr.onload=()=>{ const src=String(fr.result); const im=new Image();
        im.onload=()=>{ const alto=28, ancho=Math.max(1,Math.round((im.naturalWidth||120)*alto/(im.naturalHeight||alto)));
          CF.organizacion.logo=Object.assign({},CF.organizacion.logo,{src,ancho,alto,alt:(CF.organizacion.logo||{}).alt||CF.organizacion.nombre||""}); rr(); };
        im.onerror=()=>{ CF_MSG="No se pudo leer esa imagen."; CF_MSG_OK=false; rr(); }; im.src=src; }; fr.readAsDataURL(f); return; }
    if(ds.multi){ const sel=new Set([...box.querySelectorAll(`[data-multi="${ds.multi}"]`)].filter(x=>x.checked).map(x=>x.value));
      cfSet(ds.multi,(CF.celula.lanes||[]).map(l=>l.id).filter(id=>sel.has(id))); cfBarra(); return; }
    if(ds.mapa&&el.classList.contains("cf-k")){ const m=cfGet(ds.mapa)||{}; const nk=el.value.trim(), vk=ds.k;
      if(nk===vk) return; if(!nk||/[.\s]/.test(nk)||Object.prototype.hasOwnProperty.call(m,nk)){ CF_MSG=`La clave «${nk}» no sirve: no puede estar vacía, llevar espacios o puntos, ni repetirse.`; CF_MSG_OK=false; rr(); return; }
      const nm={}; Object.keys(m).forEach(k=>{ nm[k===vk?nk:k]=m[k]; }); cfSet(ds.mapa,nm); CF_MSG=""; rr(); return; }
    if(!ds.p) return;
    if(ds.t==="json"){ try{ cfSet(ds.p,cfValor(el)); CF_MSG=""; }catch(e){ CF_MSG="El JSON de «"+ds.p.split(".").pop()+"» no es válido: "+e.message; CF_MSG_OK=false; rr(); return; } cfBarra(); return; }
    if(["chk","mod","sel"].includes(ds.t)){ cfSet(ds.p,cfValor(el)); cfBarra(); return; }
    // un carril nuevo toma su identificador del nombre; cambiar un nombre refresca los selectores de personas
    const mm=ds.p.match(/^celula\.lanes\.(\d+)\.nm$/);
    if(mm){ const l=CF.celula.lanes[Number(mm[1])]; if(l&&CF_NUEVOS.has(l)&&!l.id){ l.id=cfSlug(l.nm,new Set(CF.celula.lanes.map(x=>x.id).filter(Boolean))); } rr(); } });
  box.addEventListener("click",async ev=>{ const b=ev.target.closest("[data-acc],#cf-guardar,#cf-descartar"); if(!b||b.disabled) return;
    if(b.id==="cf-guardar") return cfGuardar();
    if(b.id==="cf-descartar"){ CF=JSON.parse(CF0); CF_ERR=[]; CF_MSG=""; CF_BUSCA=null; return rr(); }
    const acc=b.dataset.acc, i=Number(b.dataset.i);
    if(acc==="agregar"){ const a=cfGet(b.dataset.lista)||[]; const n=JSON.parse(b.dataset.nuevo||"{}"); a.push(n); cfSet(b.dataset.lista,a); if(b.dataset.lista==="celula.lanes") CF_NUEVOS.add(n); return rr(); }
    if(acc==="quitar"){ const a=cfGet(b.dataset.lista)||[]; const x=a[i];
      if(b.dataset.lista==="celula.lanes"&&!CF_NUEVOS.has(x)&&b.dataset.arm!=="1"){ b.dataset.arm="1"; b.classList.add("arm"); b.textContent="¿Quitar? Clic otra vez"; setTimeout(()=>{ if(b.isConnected){ b.dataset.arm=""; b.classList.remove("arm"); b.textContent="Quitar"; } },4000); return; }
      a.splice(i,1); if(b.dataset.lista==="celula.lanes"&&x){ const id=x.id; if(CF.celula.carriles_movil) CF.celula.carriles_movil=CF.celula.carriles_movil.filter(z=>z!==id); }
      CF_BUSCA=null; return rr(); }
    if(acc==="subir"||acc==="bajar"){ const a=cfGet(b.dataset.lista)||[]; const j=acc==="subir"?i-1:i+1; if(j<0||j>=a.length) return; [a[i],a[j]]=[a[j],a[i]]; CF_BUSCA=null; return rr(); }
    if(acc==="agregar-k"){ const m=cfGet(b.dataset.mapa)||{}; let k="NUEVO", n=2; while(Object.prototype.hasOwnProperty.call(m,k)) k="NUEVO"+(n++); m[k]=JSON.parse(b.dataset.nuevo||'""'); cfSet(b.dataset.mapa,m); return rr(); }
    if(acc==="quitar-k"){ const m=cfGet(b.dataset.mapa)||{}; delete m[b.dataset.k]; return rr(); }
    if(acc==="buscar"){ const l=CF.celula.lanes[i]; const q=(l&&(l.nombre_jira||l.nm)||"").replace(/^[^\p{L}]+/u,"").trim(); if(!q){ CF_BUSCA={i,msg:"Escribe primero el nombre."}; return rr(); }
      CF_BUSCA={i,msg:"Buscando en Jira…"}; rr();
      try{ const r=await jcall("lookupJiraAccountId",{searchString:q}); const us=((((r||{}).data||{}).users||{}).users||(r&&r.users)||[]).filter(u=>!u.accountType||u.accountType==="atlassian");
        CF_BUSCA={i,us,msg:us.length?"":"Jira no encontró a nadie con «"+q+"»."}; }catch(e){ CF_BUSCA={i,msg:jiraErr(e)}; }
      return rr(); }
    if(acc==="elegir"){ const u=CF_BUSCA&&CF_BUSCA.us&&CF_BUSCA.us[Number(b.dataset.u)]; const l=CF.celula.lanes[i]; if(!u||!l) return;
      l.account_id=u.accountId; l.nombre_jira=u.displayName; if(u.emailAddress&&!l.correo) l.correo=u.emailAddress; CF_BUSCA=null; return rr(); }
    if(acc==="json"){ try{ const x=JSON.parse($("cf-json").value); if(!x||typeof x!=="object"||!x.celula||!x.organizacion) throw new Error("debe traer al menos «celula» y «organizacion»");
        CF={celula:x.celula, organizacion:x.organizacion, extras:x.extras||{comprometido:{},manuales:[]}, motor:x.motor||{}}; CF_MSG="JSON aplicado al formulario. Revisa y guarda."; CF_MSG_OK=true; }
      catch(e){ CF_MSG="Ese JSON no se pudo usar: "+e.message; CF_MSG_OK=false; } return rr(); }
    if(acc==="copiar"){ navigator.clipboard.writeText($("cf-json").value).then(()=>{ b.textContent="Copiado"; },()=>{ b.textContent="No se pudo copiar"; }); } });
}
async function cfGuardar(){ CF_ERR=cfValidar(CF); CF_MSG="";
  if(CF_ERR.length){ renderConfig(); const e=document.querySelector("#vistaConfig .callout.warn"); if(e&&e.scrollIntoView) e.scrollIntoView({block:"center"}); return; }
  if(!db||!IS_OWNER||!canWrite){ CF_MSG="Solo el dueño del tablero puede guardar, y con la base conectada."; CF_MSG_OK=false; return renderConfig(); }
  const antes=JSON.parse(CF0), meta={t:Date.now(), por:MI_ID||""};
  const docs=[["config","celula","celula"],["config","organizacion","organizacion"],["privado","config_extras","extras"],["privado","config_motor","motor"]]
    .filter(([,,k])=>JSON.stringify(CF[k])!==JSON.stringify(antes[k]));
  const g=$("cf-guardar"); if(g){ g.disabled=true; g.textContent="Guardando…"; }
  try{ for(const [col,id,k] of docs) await db.collection(col).doc(id).set(Object.assign(cfClon(CF[k]),{_meta:meta})); }
  catch(e){ CF_MSG="No se pudo guardar: "+(e&&(e.message||e.code)||"error")+". Nada se perdió: vuelve a intentarlo."; CF_MSG_OK=false; return renderConfig(); }
  const recarga=docs.some(([col])=>col==="config");
  CF0=JSON.stringify(CF); CF_SUCIO=false;
  CF_MSG=recarga?"Guardado. La página se recarga con la configuración nueva para todos.":"Guardado. Se aplica la próxima vez que regeneres el tablero (/status-celula en Claude Code).";
  CF_MSG_OK=true; renderConfig();
  if(recarga){ try{ sessionStorage.removeItem("tablero-config-recarga"); }catch(e){} setTimeout(()=>{ try{ location.reload(); }catch(e){} },900); } }

// ---- Arranque ----
const VISTAS_APAGADAS=new Set(Object.entries(MOD_VISTA).filter(([k])=>!MOD(k)).map(([,v])=>v));
VISTAS_APAGADAS.forEach(v=>{ const b=document.querySelector(`[data-vista="${v}"]`); if(b) b.remove(); });
try{ const v=localStorage.getItem("planeacion-vista"); if(v&&VISTAS[v]&&!VISTAS_APAGADAS.has(v)) setTimeout(()=>setVista(v),0); }catch(e){}
$("corte").textContent=CORTE;
try{ PLAN=JSON.parse(localStorage.getItem(LS)||"{}")||{}; }catch(e){ PLAN={}; }
render();
setSync("Conectando…");
if(!(window.claude&&window.claude.use)) setSync("Sin plan compartido: los cambios quedan en este navegador","bad");
if(window.claude&&window.claude.use){
  window.claude.use("mcp").then(async m=>{ MCP=m; if(!m){ $("jstat").textContent="Jira no está disponible en esta vista"; return; }
    try{ const perm=await window.claude.use("permissions"); const st=perm?await perm.state("mcp:"+SERVER).catch(()=>"unavailable"):"unavailable"; if(st==="granted") refreshJira(); }catch(e){} });
  window.claude.use("db").then(async d=>{
    if(!d){ setSync("Sin plan compartido: los cambios quedan en este navegador","bad"); return; }
    db=d; PLAN={}; render(); setSync("Conectando al plan compartido…");
    try{ const u=await window.claude.use("user"); if(u&&u.isOwner){ IS_OWNER=!!(await u.isOwner()); } if(u&&u.can){ const w=await u.can("data.write"); if(w===false){ canWrite=false; } }
      const lb=document.querySelector('[data-vista="lider"]'); if(lb) lb.hidden=!IS_OWNER; const bb=document.querySelector('[data-vista="bandeja"]'); if(bb) bb.hidden=!IS_OWNER; // la vista privada solo la ve el dueño
      const cb=document.querySelector('[data-vista="config"]'); if(cb) cb.hidden=!IS_OWNER; // la configuración solo la cambia el dueño
      if(VISTA==="config") renderConfig();
      if(u&&u.id){ MI_ID=await u.id(); const em=u.email?await u.email():null; MI_LANE=em?(CORREO_LANE[String(em).toLowerCase().split("@")[0]]||null):null;
        if(!MI_LANE){ try{ const g=localStorage.getItem("gantt-soy"); if(g&&NOMBRE[g]) MI_LANE=g; }catch(_){} } } }catch(e){}
    db.collection("plan").onSnapshot(snap=>{
      const next={}; snap.docs.forEach(s=>{ const v=s.data(); if(v&&v.key){ const c=Object.assign({},v); delete c.key; next[v.key]=c; } });
      PLAN=next; PLAN_OK=true; render(); podarPlan(); setSync(canWrite?"Plan compartido":"Plan compartido · solo lectura", canWrite?"ok":"bad");
    }, err=>{ setSync("Se perdió la conexión con el plan compartido. Recarga la página.","bad"); });
    suscribirTablero(); suscribirBacklog();
  });
}
};
</script>
<script>
// ---- Arranque: la configuración guardada desde la pestaña ⚙ Configuración (colección «config» de la base)
// manda sobre la que trae la página. Se espera la base un momento para no pintar dos veces; si tarda, se
// pinta con la de la página y, si luego aparece una guardada distinta, se recarga una sola vez.
(function(){
"use strict";
const el=id=>document.getElementById(id);
const clon=o=>JSON.parse(JSON.stringify(o));
const sinMeta=o=>{ const c=clon(o||{}); delete c._meta; return c; };
let AJ={}; try{ AJ=JSON.parse(el("ajustes").textContent)||{}; }catch(e){}
const BASE_CFG=el("cfg").textContent;
const imgLogo=document.querySelector(".band .logo");
const ORG_PAGINA={ nombre:(AJ.organizacion||{}).nombre||"", pie:(AJ.organizacion||{}).pie||"",
  logo:Object.assign({}, (AJ.organizacion||{}).logo||{}, imgLogo?{src:imgLogo.getAttribute("src")||""}:{}) };
function aplicar(docs){
  let cfg=JSON.parse(BASE_CFG), org=clon(ORG_PAGINA); const fuente={celula:"pagina", organizacion:"pagina"};
  if(docs&&docs.celula&&Array.isArray(docs.celula.lanes)){ cfg=sinMeta(docs.celula); fuente.celula=docs.celula._meta||{}; }
  if(docs&&docs.organizacion&&docs.organizacion.nombre){ org=sinMeta(docs.organizacion); fuente.organizacion=docs.organizacion._meta||{}; }
  cfg.org=Object.assign({}, cfg.org, {nombre:(cfg.org&&cfg.org.nombre)||org.nombre});
  el("cfg").textContent=JSON.stringify(cfg);
  window.__CFG_ACTIVA={celula:cfg, organizacion:org, fuente, generado:AJ.generado||0,
    extras:clon(AJ.extras||{comprometido:{},manuales:[]}), motor:clon(AJ.motor||{})};
  // lo que vive fuera del script de la aplicación: título, banda, logo y pie
  const p=cfg.pagina||{};
  document.title=p.titulo||document.title;
  const h1=document.querySelector(".band h1"); if(h1&&p.titulo) h1.textContent=p.titulo;
  const sub=document.querySelector(".band .sub"); if(sub) sub.textContent=p.subtitulo||"";
  if(imgLogo&&org.logo){ if(org.logo.src) imgLogo.setAttribute("src",org.logo.src); imgLogo.alt=org.logo.alt||org.nombre||"";
    if(org.logo.ancho) imgLogo.width=org.logo.ancho; if(org.logo.alto) imgLogo.height=org.logo.alto; }
  const pie=document.querySelectorAll("footer.pie span"); if(pie[0]) pie[0].textContent=org.pie||""; if(pie[1]) pie[1].textContent=p.pie_uso||"";
}
let arrancado=false;
function arrancar(docs){ if(arrancado) return; arrancado=true; try{ aplicar(docs); }catch(e){ console.error("Configuración guardada inválida; se usa la de la página",e); try{ aplicar(null); }catch(_){} } window.__ARRANCAR(); }
const huella=docs=>JSON.stringify([docs&&docs.celula&&docs.celula._meta, docs&&docs.organizacion&&docs.organizacion._meta]);
async function leer(){ const d=await window.claude.use("db"); if(!d) return null; const s=await d.collection("config").get(); const o={}; s.docs.forEach(x=>{ o[x.id]=x.data(); }); return o; }
if(!(window.claude&&window.claude.use)){ arrancar(null); return; }
const espera=setTimeout(()=>arrancar(null),2500);
leer().then(docs=>{
  if(!arrancado){ clearTimeout(espera); arrancar(docs); return; }
  // llegó tarde: si trae una configuración guardada, se recarga una sola vez para aplicarla
  if(docs&&(docs.celula||docs.organizacion)){ const h=huella(docs); let ya=""; try{ ya=sessionStorage.getItem("tablero-config-recarga")||""; }catch(e){}
    if(ya!==h){ try{ sessionStorage.setItem("tablero-config-recarga",h); }catch(e){} location.reload(); } }
}).catch(()=>{ clearTimeout(espera); arrancar(null); });
})();
</script>
