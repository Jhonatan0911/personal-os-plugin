<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<!--
  Personal OS · Status de la célula. Plantilla del tablero: la llena scripts/status-celula.js
  (inyecta los datos en el bloque JSON con id «datos»). Archivo local y privado: no se publica.
  REGLA QUE NO SE ROMPE: el tablero NO escribe en Jira. Todo cambio cae en «Cambios propuestos».
-->
<style>
:root{
  --bg:#f5f6f8;--panel:#ffffff;--panel2:#eef1f4;--line:#dde2e8;--text:#1c232c;--soft:#5d6977;
  --accent:#3d5a80;--ok:#2d7a4d;--ok-bg:#e4f2ea;--warn:#9c6008;--warn-bg:#fcefdb;--crit:#b03a3a;--crit-bg:#fae7e7;
  --we:#e9edf1;--hueco:#fff4d6;--hoy:rgba(61,90,128,.12);--na:#8a95a3;--na-bg:#eef1f4;--sombra:0 1px 2px rgba(0,0,0,.06);
  --dia:40px;--who:210px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151b;--panel:#181e26;--panel2:#202833;--line:#2c3643;--text:#e5e9ee;--soft:#9ba7b5;
    --accent:#8fb0d9;--ok:#6cc28f;--ok-bg:#1b3125;--warn:#e2a64c;--warn-bg:#382a14;--crit:#ee8080;--crit-bg:#3b1e21;
    --we:#1c232c;--hueco:#3a321a;--hoy:rgba(143,176,217,.15);--na:#7d8896;--na-bg:#222a35;--sombra:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151b;--panel:#181e26;--panel2:#202833;--line:#2c3643;--text:#e5e9ee;--soft:#9ba7b5;
  --accent:#8fb0d9;--ok:#6cc28f;--ok-bg:#1b3125;--warn:#e2a64c;--warn-bg:#382a14;--crit:#ee8080;--crit-bg:#3b1e21;
  --we:#1c232c;--hueco:#3a321a;--hoy:rgba(143,176,217,.15);--na:#7d8896;--na-bg:#222a35;--sombra:none;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:hidden}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1500px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin-bottom:12px}
.kicker{font-size:11px;letter-spacing:.12em;color:var(--soft);font-weight:600}
h1{margin:2px 0 0;font-size:22px}
.meta{color:var(--soft);font-size:12.5px}
.kpis{display:flex;flex-wrap:wrap;gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;min-width:92px;box-shadow:var(--sombra)}
.kpi b{display:block;font-size:20px;line-height:1.1}
.kpi span{font-size:11.5px;color:var(--soft)}
.kpi.crit b{color:var(--crit)} .kpi.warn b{color:var(--warn)} .kpi.na b{color:var(--na)}
.aviso{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:13px}
.aviso.ok{border-left-color:var(--ok);background:var(--ok-bg)}
.aviso ul{margin:4px 0 0;padding-left:18px}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:10px 0 12px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px;cursor:pointer;color:var(--soft);font-weight:600}
.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--panel2);font-size:11px;margin-left:4px;color:var(--soft)}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 10px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.ctrl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px;font-size:13px}
.ctrl label{display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.grupo-z{display:inline-flex;gap:0}
.grupo-z .btn{border-radius:0}.grupo-z .btn:first-child{border-radius:8px 0 0 8px}.grupo-z .btn:last-child{border-radius:0 8px 8px 0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:12px}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}:root{--who:130px}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--sombra)}
/* Gantt */
.gantt{overflow:auto;max-height:78vh;position:relative}
.grow{display:flex;border-bottom:1px solid var(--line);min-width:max-content}
.who{position:sticky;left:0;z-index:3;width:var(--who);flex:0 0 var(--who);background:var(--panel);border-right:1px solid var(--line);padding:6px 8px;font-size:13px}
.who .carga{display:block;color:var(--soft);font-size:11.5px}
.who .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.who .pleg{background:none;border:0;cursor:pointer;color:var(--soft);padding:0 4px 0 0}
.who .rol{font-size:11px;color:var(--soft)}
.escala{position:sticky;top:0;z-index:4;background:var(--panel)}
.escala .who{z-index:5;display:flex;align-items:flex-end;font-weight:600;color:var(--soft)}
.dias-h{display:flex}
.dia-h{width:var(--dia);flex:0 0 var(--dia);text-align:center;font-size:10.5px;color:var(--soft);padding:3px 0;border-left:1px solid transparent}
.dia-h b{display:block;font-size:12px;color:var(--text)}
.dia-h.nohab{background:var(--we)} .dia-h.hoy{background:var(--hoy)} .dia-h.hoy b{color:var(--accent)}
.dia-h.lunes{border-left-color:var(--line)} .dia-h .mm{display:block;font-size:9.5px;font-weight:700;color:var(--accent)}
.dia-h.fest b{text-decoration:line-through}
.lane{position:relative}
.celdas{display:flex;position:absolute;inset:0}
.celda{width:var(--dia);flex:0 0 var(--dia);height:100%;border-left:1px solid transparent}
.celda.nohab{background:var(--we)} .celda.hoy{background:var(--hoy)} .celda.lunes{border-left-color:var(--line)}
.celda.hueco{background:repeating-linear-gradient(45deg,var(--hueco) 0 6px,transparent 6px 12px)}
.barra{position:absolute;height:22px;border:0;border-radius:5px;color:#fff;font-size:11.5px;text-align:left;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab;touch-action:none;box-shadow:0 1px 1px rgba(0,0,0,.15)}
.barra.fijo{cursor:pointer}
.barra.sigue{border-top-right-radius:0;border-bottom-right-radius:0}
.barra.cont{border-top-left-radius:0;border-bottom-left-radius:0}
.barra .avance{position:absolute;left:0;bottom:0;height:3px;background:rgba(255,255,255,.85)}
.barra .avance.excedido{background:#ffb3b3}
.barra .tirador{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:ew-resize;background:rgba(255,255,255,.25)}
.barra.vencida{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 5px,transparent 5px 10px)}
.barra.riesgo{outline:2px solid var(--crit);outline-offset:1px}
.barra.hecha{opacity:.4}
.barra.tarde{box-shadow:inset 0 -3px 0 var(--crit)}
.barra.impl{opacity:.8;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.35) 0 2px,transparent 2px 7px)}
.barra.redef{background:var(--na)!important;opacity:.6}
.barra.pausada{background:var(--na)!important;opacity:.7;border:1px dashed var(--text)}
.barra.grupo{background:var(--accent)!important;color:var(--bg);font-weight:600}
.barra.grupo.vencida{background:var(--crit)!important;color:#fff}
.barra.trans{border:1px dashed rgba(255,255,255,.8)}
.barra.comp{background:var(--panel2)!important;color:var(--text);border-left:5px solid var(--warn)}
.barra.reunion{border-left:5px solid rgba(255,255,255,.7)}
.barra.mini{height:9px;font-size:0;padding:0}
.barra.sel{z-index:6;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.barra .rec{font-weight:600;margin-right:4px;opacity:.9}
.tag-t{display:inline-block;font-size:10px;font-weight:700;padding:0 4px;border-radius:3px;background:rgba(255,255,255,.25);margin-right:4px}
.cargad{position:absolute;height:18px;border-radius:4px;font-size:10.5px;text-align:center;line-height:18px;border:1px solid transparent}
.cargad.libre{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.cargad.lleno{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.cargad.sobre{background:var(--crit-bg);border-color:var(--crit);color:var(--crit)}
.cargad.nada{background:transparent;border:1px dashed var(--line);color:var(--soft)}
.hoy-l{color:var(--warn)} .hoy-o{color:var(--ok)} .hoy-s{color:var(--crit)}
.resumen-pleg{position:absolute;left:8px;top:8px;font-size:12px;color:var(--soft)}
.leyenda{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--soft);padding:8px 10px}
.leyenda i{display:inline-block;width:18px;height:10px;border-radius:3px;margin-right:4px;vertical-align:middle}
/* Panel lateral */
.side{display:flex;flex-direction:column;gap:12px}
.side h3{margin:0;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px}
.side h3 .btn{padding:3px 8px;font-size:12px}
.chips{padding:8px;display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.chip{border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:grab;background:var(--panel)}
.chip b{font-size:12px} .chip .t{font-size:12.5px} .chip .h{font-size:11px;color:var(--soft)}
.cambios{padding:8px;font-size:12.5px;max-height:30vh;overflow:auto}
.cambios li{margin-bottom:4px}
.vacio{color:var(--soft);font-size:12.5px;padding:8px}
/* Tarjetas y tablas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:0 0 6px;box-shadow:var(--sombra);min-width:0}
.card h2{font-size:14px;margin:0;padding:9px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.card h2.crit{border-left:4px solid var(--crit)} .card h2.alto{border-left:4px solid var(--warn)}
.card h2 .n{color:var(--soft);font-weight:600}
.item{padding:8px 12px;border-bottom:1px solid var(--line)} .item:last-child{border-bottom:0}
.item .sub{color:var(--soft);font-size:12.5px;margin-top:2px}
.dias{float:right;font-size:12px;font-weight:700;color:var(--crit);margin-left:8px}
.pill{display:inline-block;font-size:11px;padding:0 6px;border-radius:9px;background:var(--panel2);color:var(--soft);margin:2px 4px 0 0}
.pill.c{background:var(--crit-bg);color:var(--crit)} .pill.a{background:var(--warn-bg);color:var(--warn)}
.fr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px;margin:12px 0}
.fr{display:flex;gap:8px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px}
.sem{width:10px;height:10px;border-radius:50%;margin-top:4px;flex:0 0 10px}
.sem.r{background:var(--crit)} .sem.a{background:var(--warn)} .sem.v{background:var(--ok)}
.tabla-w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--soft);font-weight:600;background:var(--panel2);position:sticky;top:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:700;background:var(--panel2)}
tr.clic{cursor:pointer} tr.clic:hover td{background:var(--hoy)}
.mal{color:var(--crit);font-weight:600} .reg{color:var(--warn);font-weight:600} .bien{color:var(--ok);font-weight:600}
h2.sec{font-size:16px;margin:18px 0 8px}
.p1{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:12px}
/* Timesheets */
.tsd{text-align:center;font-size:11px;min-width:42px}
.tsd.ok{background:var(--ok-bg);color:var(--ok)} .tsd.sin_correo{background:var(--warn-bg);color:var(--warn)}
.tsd.falta{background:var(--crit-bg);color:var(--crit)} .tsd.festivo,.tsd.pendiente,.tsd.no_leido{background:var(--panel2);color:var(--soft)}
/* Diálogo */
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);max-width:min(640px,calc(100vw - 32px));width:100%;padding:0}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{padding:12px 16px;border-bottom:1px solid var(--line)} .dh h3{margin:0;font-size:15px}
.db{padding:12px 16px;max-height:65vh;overflow:auto}
.df{padding:10px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.ver{border-radius:8px;padding:8px 12px;margin-bottom:10px}
.ver.ex{background:var(--crit-bg);color:var(--crit)} .ver.al{background:var(--warn-bg);color:var(--warn)}
.ver.ok{background:var(--ok-bg);color:var(--ok)} .ver.na{background:var(--na-bg);color:var(--na)}
.ver b{display:block}
.ver span{color:var(--text);font-size:12.5px}
.bar-t{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden;margin:4px 0}
.bar-t i{display:block;height:100%}
dl.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:0;font-size:13px}
dl.kv dt{color:var(--soft)}
.form-row{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.form-row select,.form-row input{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2)}
.form-row textarea{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel2);min-height:64px;font:inherit;color:inherit}
.pc{color:var(--soft);font-size:11px;font-weight:400}
.ajeno{display:inline-block;font-size:10.5px;padding:0 6px;border-radius:9px;background:var(--warn-bg);color:var(--warn);margin-left:6px}
.com{border-left:3px solid var(--line);padding:4px 8px;margin-bottom:8px;font-size:12.5px}
.com .quien{font-weight:600}.com .cuando{color:var(--soft);font-size:11px;margin-left:6px}
.com .txt{white-space:pre-wrap;margin-top:2px}
.hist{font-size:12px;max-height:180px;overflow:auto}.hist div{padding:2px 0;border-bottom:1px dashed var(--line)}
h4.sub{margin:12px 0 6px;font-size:13px;color:var(--soft)}
.prop{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}.prop .form-row{flex:1;min-width:200px;margin:0}
tr.k{cursor:pointer} tr.k:hover td{background:var(--hoy)}
footer{color:var(--soft);font-size:11.5px;margin-top:16px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <div class="kicker">__KICKER__</div>
      <h1>__TITULO__</h1>
      <div class="meta" id="meta"></div>
    </div>
    <div class="kpis" id="kpis"></div>
  </header>
  <div id="cobertura"></div>
  <nav class="tabs" id="tabs">
    <button class="tab on" data-v="crono">Cronograma</button>
    <button class="tab" data-v="mesa">Mesa <span class="n" id="nMesa"></span></button>
    <button class="tab" data-v="lider">Líder <span class="n" id="nLider"></span></button>
    <button class="tab" data-v="jira">Status Jira</button>
    <button class="tab" data-v="frentes">Frentes</button>
    <button class="tab" data-v="ts">Timesheets <span class="n" id="nTs"></span></button>
    <span style="flex:1"></span>
    <button class="btn" id="tema" title="Cambiar tema claro/oscuro" style="align-self:center">◐ Tema</button>
  </nav>

  <section id="v-crono">
    <div class="ctrl">
      <span class="grupo-z" id="zoom">
        <button class="btn" data-z="28">Compacto</button><button class="btn on" data-z="40">Normal</button><button class="btn" data-z="60">Amplio</button>
      </span>
      <label><input type="checkbox" id="fHuecos"> Resaltar huecos</label>
      <label><input type="checkbox" id="fVencidas"> Solo vencidas</label>
      <label><input type="checkbox" id="fHechas"> Ocultar terminadas</label>
      <label title="Issues de otros proyectos: se muestran con su nombre. Apagado, se resumen en una barra por proyecto."><input type="checkbox" id="fTrans" checked> Mostrar transversales</label>
    </div>
    <div class="layout">
      <div class="panel">
        <div class="gantt" id="gantt"></div>
        <div class="leyenda" id="leyenda"></div>
      </div>
      <aside class="side">
        <div class="panel">
          <h3>Sin programar <span class="pill" id="nPend"></span></h3>
          <div class="chips" id="pendientes"></div>
        </div>
        <div class="panel">
          <h3>Cambios propuestos <span class="pill" id="nCambios">0</span> <span><button class="btn" id="copiar">Copiar para Jira</button> <button class="btn" id="deshacer" title="Devuelve las barras a como vinieron de Jira y vacía la lista">Deshacer</button></span></h3>
          <div class="cambios" id="cambios"><div class="vacio">Arrastra una barra o una tarjeta: el cambio queda aquí. El tablero no escribe en Jira.</div></div>
        </div>
      </aside>
    </div>
  </section>

  <section id="v-mesa" hidden>
    <div id="frentesRapidos"></div>
    <div class="cards" id="secciones"></div>
  </section>
  <section id="v-lider" hidden><div id="liderCuerpo"></div></section>
  <section id="v-jira" hidden><div id="jiraCuerpo"></div></section>
  <section id="v-frentes" hidden><div id="frentesCuerpo"></div></section>
  <section id="v-ts" hidden><div id="tsCuerpo"></div></section>

  <footer id="pie"></footer>
</div>

<dialog id="dlg"><div class="dh"><h3 id="dlgT"></h3></div><div class="db" id="dlgB"></div>
  <div class="df" id="dlgF"><button class="btn" data-cerrar>Cerrar</button></div></dialog>

<script id="datos" type="application/json">__DATOS_JSON__</script>
<script>
'use strict';
const D = JSON.parse(document.getElementById('datos').textContent);
const $ = (id) => document.getElementById(id);
const esc = (s) => (s == null ? '' : String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])));
const ls = {
  get(k, d) { try { const v = localStorage.getItem('sc-' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('sc-' + k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento */ } },
};

// ── Tema ──────────────────────────────────────────────────────────────────────
(function tema() {
  const t = ls.get('tema', null);
  if (t) document.documentElement.setAttribute('data-theme', t);
  $('tema').onclick = () => {
    const oscuro = document.documentElement.getAttribute('data-theme') === 'dark' ||
      (!document.documentElement.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
    const nuevo = oscuro ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', nuevo); ls.set('tema', nuevo);
  };
})();

// ── Fechas y días hábiles (festivos y jornada vienen del config del usuario) ──────
const MS = 86400000;
const dU = (s) => new Date(Date.parse(s + 'T00:00:00Z'));
const iso = (d) => d.toISOString().slice(0, 10);
const addD = (s, n) => iso(new Date(dU(s).getTime() + n * MS));
const dif = (a, b) => Math.round((dU(b) - dU(a)) / MS);
const dowOf = (s) => dU(s).getUTCDay();
const FEST = new Set(D.festivos || []);
const JOR = D.jornada || [0, 8, 8, 8, 8, 8, 0];
const JOR_MEDIA = (() => { const p = JOR.filter((x) => x > 0); return p.length ? p.reduce((a, b) => a + b, 0) / p.length : 8; })();
const esHabil = (s) => JOR[dowOf(s)] > 0 && !FEST.has(s);
const jornadaDe = (s) => (esHabil(s) ? JOR[dowOf(s)] : 0);
function sigHabil(s) { let x = s; for (let n = 0; n < 60 && !esHabil(x); n++) x = addD(x, 1); return x; }
function antHabil(s) { let x = s; for (let n = 0; n < 60 && !esHabil(x); n++) x = addD(x, -1); return x; }
const snap = (s, dir) => (esHabil(s) ? s : dir < 0 ? antHabil(s) : sigHabil(s));
function finPorHabiles(ini, n) { let f = sigHabil(ini); for (let c = 1; c < Math.max(1, n); c++) f = sigHabil(addD(f, 1)); return f; }

// ── Cambios propuestos (el tablero NO escribe en Jira) ───────────────────────────
function registrar(txt) {
  cambios.push(txt);
  $('cambios').innerHTML = '<ol style="margin:0;padding-left:18px">' + cambios.map((c) => `<li>${esc(c)}</li>`).join('') + '</ol>';

$('copiar').onclick = () => {
  if (!cambios.length) return;
  const txt = `Cambios propuestos (status de la célula, corte ${D.corte}):\n` + cambios.map((c) => '- ' + c).join('\n');
  const fallback = () => { const t = document.createElement('textarea'); t.value = txt; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (e) { /* nada */ } t.remove(); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).catch(fallback); else fallback();
  $('copiar').textContent = 'Copiado ✓'; setTimeout(() => { $('copiar').textContent = 'Copiar para Jira'; }, 1500);
};
/* Deshacer: las barras vuelven a como vinieron de Jira, lo programado vuelve a «Sin programar» y la lista
   se vacía. Los frentes movidos también vuelven a su titular. Es la salida segura tras ensayar un plan. */
$('deshacer').onclick = () => {
  for (let k = items.length - 1; k >= 0; k--) {
    const i = items[k];
    if (i._o && i._o.persona === null && i._prog) { pendientes.push(i._prog); items.splice(k, 1); continue; }
    if (i._o && i._o.persona) { i.persona = i._o.persona; i.ini = i._o.ini; i.fin = i._o.fin; i.vence = i._o.vence; i.recortada = i._o.recortada; i.desde_real = i._o.desde_real; i.vencida = i._o.vencida; }
  }
  (frentesAcuerdo() || []).forEach((f) => { if (f._o) { f.titular = f._o.titular; f.backup = f._o.backup; } });
  cambios.length = 0; $('nCambios').textContent = '0';
  $('cambios').innerHTML = '<div class="vacio">Sin cambios propuestos.</div>';
  pintar(); pintarPendientes(); resumen(); pintarFrentes();
};

// ── Interacción: mover, alargar, reasignar ──────────────────────────────────────
const byId = (id) => items.find((x) => x.id === id) || (() => { for (const p of PERS) { const g = visiblesDe(p.slug).find((x) => x.id === id); if (g) return g; } return null; })();
let arr = null;
$('gantt').addEventListener('pointerdown', (e) => {
  const b = e.target.closest('.barra'); if (!b) return;
  const it = byId(b.dataset.id); if (!it) return;
  arr = { it, el: b, x0: e.clientX, y0: e.clientY, resize: e.target.classList.contains('tirador'), movido: false, w0: b.offsetWidth };
  try { b.setPointerCapture(e.pointerId); } catch (er) { /* nada */ }
});
document.addEventListener('pointermove', (e) => {
  if (!arr || arr.it.fijo) return;
  const dx = e.clientX - arr.x0, dy = e.clientY - arr.y0;
  if (!arr.movido && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
  arr.movido = true; arr.el.classList.add('sel');
  if (arr.resize) arr.el.style.width = Math.max(ANCHO - 5, arr.w0 + dx) + 'px'; else arr.el.style.transform = `translate(${dx}px,${dy}px)`;
});
document.addEventListener('pointerup', (e) => {
  if (!arr) return;
  const a = arr; arr = null;
  if (!a.movido) { abrirFicha(a.it); return; }
  const it = a.it, dd = Math.round((e.clientX - a.x0) / ANCHO);
  const antes = `${nombre(it.persona)}, ${fdm(it.ini)} → ${fdm(it.fin)}`;
  if (a.resize) {
    let f = snap(addD(it.fin, dd), dd < 0 ? -1 : 1); if (f < it.ini) f = it.ini; if (f > D.hasta) f = antHabil(D.hasta); it.fin = f;
  } else {
    const n = Math.max(1, habilesIncl(it.ini, it.fin));
    let ini = snap(addD(it.ini, dd), dd < 0 ? -1 : 1); if (ini < D.desde) ini = sigHabil(D.desde);
    let fin = finPorHabiles(ini, n); if (fin > D.hasta) fin = antHabil(D.hasta);
    it.ini = ini; it.fin = fin;
    a.el.style.visibility = 'hidden';
    const lane = document.elementFromPoint ? document.elementFromPoint(e.clientX, e.clientY) : null;
    const l = lane && lane.closest ? lane.closest('.lane') : null;
    a.el.style.visibility = '';
    if (l && l.dataset.p && l.dataset.p !== it.persona) it.persona = l.dataset.p;
  }
  it.vence = it.fin; it.recortada = null; it.desde_real = null; it.vencida = it.fin < D.corte;
  const despues = `${nombre(it.persona)}, ${fdm(it.ini)} → ${fdm(it.fin)}`;
  if (antes !== despues) registrar(`${it.id} (${it.titulo}): ${antes}  ⇒  ${despues}`);
  pintar(); resumen();
});
$('gantt').addEventListener('click', (e) => {

  const s = b.dataset.p; plegados.has(s) ? plegados.delete(s) : plegados.add(s); ls.set('plegados', [...plegados]); pintar();

$('gantt').addEventListener('dragover', (e) => { if (e.target.closest('.lane')) e.preventDefault(); });
$('gantt').addEventListener('drop', (e) => {
  const l = e.target.closest('.lane'); if (!l) return; e.preventDefault();
  const id = e.dataTransfer.getData('text/plain'); const k = Math.max(0, Math.floor((e.clientX - l.getBoundingClientRect().left) / ANCHO));
  programar(id, l.dataset.p, DIAS[Math.min(k, DIAS.length - 1)].f);

function programar(id, persona, dia) {
  const i = pendientes.findIndex((p) => p.id === id); if (i < 0) return;
  const p = pendientes[i];
  const ini = sigHabil(dia < D.desde ? D.desde : dia);
  const n = Math.max(1, Math.ceil((+p.horas || JOR_MEDIA) / JOR_MEDIA));
  let fin = finPorHabiles(ini, n); if (fin > D.hasta) fin = antHabil(D.hasta);
  items.push(Object.assign({}, p, { persona, ini, fin, vence: fin, vencida: fin < D.corte, _o: { persona: null }, _prog: p }));
  pendientes.splice(i, 1);
  registrar(`${p.id} (${p.titulo}): programar para ${nombre(persona)}, ${fdm(ini)} → ${fdm(fin)}`);
  pintar(); pintarPendientes(); resumen();
}

  const conUltima = (c) => `<b>${esc(c.id || '')}</b>${c.id ? ' · ' : ''}${esc(c.titulo)}${c.ultima ? `<div class="pc">${esc(c.ultima)}</div>` : ''}`;
  const fechaC = (c) => { const f = c.fecha || c.desde; return `<span class="${f && f < D.corte ? 'mal' : ''}">${f ? fdm(f) : '<span class="reg">sin fecha</span>'}${c.dias > 0 ? ` · ${c.dias} d` : ''}</span>`; };
  const P = L.propias;
  const tProp = P ? `<div class="item"><div class="sub">${P.abiertas} abiertas · <span class="mal">${P.vencidas} vencidas</span> · ${P.sin_fecha} sin fecha · ${P.sin_est} sin estimación</div></div>` +
    tablaSimple(P.lista, [['id', 'Issue', '', (i) => `${i.url ? `<a href="${esc(i.url)}" target="_blank" rel="noopener">${esc(i.id)}</a>` : esc(i.id)} · ${esc(i.titulo)}`], ['estado', 'Estado'],
      ['fin', 'Fecha', '', (i) => `<span class="${i.fin && i.fin < D.corte ? 'mal' : ''}">${i.fin ? fdm(i.fin) : '<span class="reg">sin fecha</span>'}</span>`]]) : '';
  const r3 = (L.riesgos || []).filter((r) => r.nivel >= 3).length;
  $('liderCuerpo').innerHTML = (L.prioridad ? `<div class="p1"><b>Prioridad #1 vigente</b><p style="margin:4px 0">${esc(L.prioridad)}</p><small class="${briefViejo ? 'reg' : 'meta'}">${L.aviso_brief ? esc(L.aviso_brief) : L.fecha_brief ? `Del brief del ${fdm(L.fecha_brief)}${briefViejo ? ': el brief de hoy no ha corrido' : ''}` : 'Sin fecha de brief'}</small></div>`
      : `<div class="aviso">No hay prioridad #1 en los datos: el brief de hoy no ha corrido o no se leyó.</div>`) +
    `<div class="cards">` +
    tarjeta('Mi cola de revisión', 'crit', nRev, tablaSimple(colas('revision'), colCols)) +
    tarjeta('Cola de implementación', 'alto', nImp, tablaSimple(colas('implementacion'), colCols)) +
    (P ? tarjeta('Mis issues en Jira', 'alto', P.abiertas, tProp) : '') +
    tarjeta('Mis compromisos abiertos', 'crit', (L.compromisos || []).length, tablaSimple(L.compromisos, [['titulo', 'Compromiso', '', conUltima], ['con', 'Con'], ['fecha', 'Fecha', '', fechaC], ['verif', 'Verificado', '', (c) => fdm(c.verif)]])) +
    tarjeta('Lo que espero de terceros', '', (L.terceros || []).length, tablaSimple(L.terceros, [['titulo', 'Qué', '', conUltima], ['de', 'De quién'], ['fecha', 'Fecha / pedido', '', fechaC], ['verif', 'Verificado', '', (c) => fdm(c.verif)]])) +
    tarjeta(`Riesgos abiertos${r3 ? ` · ${r3} de nivel 3` : ''}`, 'crit', (L.riesgos || []).length, tablaSimple(L.riesgos, [['nivel', 'Nivel', 'num', (r) => `<span class="${r.nivel >= 3 ? 'mal' : r.nivel === 2 ? 'reg' : ''}">${esc(r.nivel)}</span>`], ['titulo', 'Riesgo', '', conUltima]])) +
    tarjeta('Alcances comprometidos', '', (L.alcances || []).length, tablaSimple(L.alcances, [['nombre', 'Alcance', '', (a) => `${a.id ? `<b>${esc(a.id)}</b> · ` : ''}${esc(a.nombre)}`], ['entrega', 'Entrega', '', (a) => fdm(a.entrega)], ['verificado_el', 'Cruzado', '', (a) => `<span class="${a.verificado_el && a.verificado_el < D.corte ? 'reg' : ''}">${fdm(a.verificado_el)}</span>`], ['resumen', 'Puntos']])) +
    `</div>`;
}

// ── Status Jira: las nueve columnas, calculadas desde las issues crudas ───────────────
const COLS9 = [['abiertas', 'Abiertas'], ['con_resp', 'Con resp.'], ['sin_resp', 'Sin resp.'], ['en_desarrollo', 'En desarrollo'], ['en_revision', 'En revisión'], ['sin_mov', 'Sin mov. 30 d'], ['vencidas', 'Vencidas'], ['sin_est', 'Sin estimación'], ['sin_fecha', 'Sin fecha']];
const J_ = D.jira || null;
/* Nombre corto de un displayName de Jira: el de la persona con carril, el de `externos` o el alias del JSON. */
function alias(n) {
  if (!n) return 'sin responsable';
  const k = String(n).toLowerCase();
  const p = PERS.find((x) => String(x.jira || '').toLowerCase() === k);
  if (p) return p.nombre;
  const x = ((J_ && J_.externos) || []).find((e) => String(e.jira || '').toLowerCase() === k);
  if (x && x.nombre) return x.nombre;
  return (J_ && J_.alias && J_.alias[n]) || n;
}
const enCelula = (n) => PERS.some((p) => p.jira && String(p.jira).toLowerCase() === String(n || '').toLowerCase());
const esExterno = (n) => ((J_ && J_.externos) || []).some((e) => String(e.jira || '').toLowerCase() === String(n || '').toLowerCase());
function pintarJira() {
  const J = D.jira;

  const M = J.metricas;
  // Solo se pinta lo que se mira: un 0 en «sin responsable» es bueno; el % dice cuánto pesa.
  const celda = (f, c) => {
    const v = f[c] || 0, pc = f.abiertas ? Math.round(v / f.abiertas * 100) : 0;
    const malo = (['sin_resp', 'sin_mov', 'sin_est', 'sin_fecha'].includes(c) && v > 0 && pc >= 25) || (c === 'vencidas' && v > 0) || (c === 'en_desarrollo' && M.limite_wip && v > M.limite_wip && !f.total);
    const suf = ['sin_resp', 'sin_mov', 'sin_est', 'sin_fecha'].includes(c) && v > 0 && f.abiertas ? ` <span class="pc">${pc}%</span>` : '';
    return `<td class="num ${malo ? 'reg' : ''}">${v}${suf}</td>`;
  };
  const tabla = (id, filas, primera, attr) => `<div class="tabla-w"><table id="${id}"><thead><tr><th>${primera}</th>${COLS9.map((c) => `<th class="num">${c[1]}</th>`).join('')}</tr></thead><tbody>` +
    filas.map((f) => `<tr class="${f.total ? 'total' : 'clic'}" ${f.total ? '' : attr(f)}><td>${f.total ? 'TOTAL' : esc(f.clave ? f.clave + (f.nombre ? ' · ' + f.nombre : '') : f.nombre)}` +
      `${f.externo ? '<span class="ajeno">no es de tu célula</span>' : ''}${!f.total && (M.excede_wip || []).includes(f.nombre) ? ` <span class="pill c">más de ${M.limite_wip} en desarrollo</span>` : ''}</td>${COLS9.map((c) => celda(f, c[0])).join('')}</tr>`).join('') + `</tbody></table></div>`;
  const tot = M.proyectos.find((p) => p.total);
  const avisos = [];
  if (tot && tot.sin_resp) avisos.push(`<div class="aviso"><b>${tot.sin_resp} de ${tot.abiertas} issues abiertas de tus proyectos (${Math.round(tot.sin_resp / tot.abiertas * 100)} %) no tienen responsable.</b> Un conteo por responsable no las ve.</div>`);
  if ((M.excede_wip || []).length) avisos.push(`<div class="aviso"><b>Más de ${M.limite_wip} «en desarrollo» a la vez:</b> ${M.excede_wip.map(esc).join(', ')}.</div>`);
  if (M.sin_historial) avisos.push(`<div class="aviso"><b>Historial de cambios no incluido</b> en ${M.sin_historial} issues de la célula: Jira lo entrega issue por issue. La ficha enlaza a Jira, donde está completo.</div>`);
  $('jiraCuerpo').innerHTML = avisos.join('') +
    `<p class="meta">Corte ${fdm(D.corte)} · «sin movimiento» = sin actualizar desde el ${fdm(M.corte_movimiento)}. Clic en una fila para ver sus issues, ordenadas por lo que arde; clic en una issue para su ficha.</p>` +
    (M.proyectos.length ? `<h2 class="sec">Proyectos</h2>` + tabla('tjProyectos', M.proyectos, 'Proyecto', (f) => `data-proy="${esc(f.clave)}"`) : '') +
    `<h2 class="sec">Tu célula · todas sus issues abiertas, en el proyecto que sea</h2>` + tabla('tjCelula', M.celula, 'Persona', (f) => `data-pers="${esc(f.jira)}"`) +
    (M.externos.length ? `<h2 class="sec">De fuera de la célula, dentro de tus proyectos <small class="meta">responden a otro líder</small></h2>` + tabla('tjExternos', M.externos, 'Persona', (f) => `data-pers="${esc(f.jira)}"`) : '') +
    `<h2 class="sec">Sin responsable en tus proyectos</h2>` + tabla('tjHuerfanas', [Object.assign({ nombre: 'Bolsa sin responsable' }, M.huerfanas)], 'Bolsa', () => 'data-huerf="1"');
}
const estadoEn = (e, lista) => (lista || []).some((x) => { const a = String(x).toLowerCase(), v = String(e || '').toLowerCase(); return a.endsWith('*') ? v.startsWith(a.slice(0, -1).trim()) : a === v; });
function issuesPorCalor(lista) {
  const E = D.estados || {};
  const peso = (i) => (i.fin && i.fin < D.corte ? 0 : estadoEn(i.estado, E.revision || ['Listo para revisión', 'En revisión*']) ? 1 : estadoEn(i.estado, E.desarrollo || ['En Desarrollo', 'En curso', 'In Progress']) ? 2 : 3);
  return lista.slice().sort((a, b) => peso(a) - peso(b) || String(a.fin || '9').localeCompare(String(b.fin || '9')));
}
function abrirListaJira(tr) {
  const abiertas = (D.jira.issues || []).filter((i) => i.categoria !== 'done' && !estadoEn(i.estado, (D.estados || {}).no_cierre));

  else { const cl = (D.jira.proyectos || []).map((p) => p.clave); sel = abiertas.filter((i) => !i.persona && cl.includes(i.proyecto)); titulo = 'Sin responsable'; }
  sel = issuesPorCalor(sel);
  abrirDlg(`${titulo} · ${sel.length}`, sel.length ? `<div class="tabla-w"><table id="listaTareas"><tr><th>Issue</th><th>Estado</th><th>Vence</th><th class="num">Est.</th></tr>` + sel.map((i) =>
    `<tr class="k tarea" data-k="${esc(i.clave)}" title="Clic: la ficha"><td><b>${esc(i.clave)}</b> · ${esc(i.titulo)}${(i.comentarios || []).length ? ` <span class="pc">${i.comentarios.length} coment.</span>` : ''}` +
    `${(i.actualizado || '9999') < (D.jira.metricas.corte_movimiento || '') ? ` <span class="pc">quieta desde ${fdm(i.actualizado)}</span>` : ''}</td><td>${esc(i.estado)}</td>` +
    `<td class="${i.fin && i.fin < D.corte ? 'mal' : ''}">${i.fin ? fdm(i.fin) : '<span class="reg">sin fecha</span>'}</td><td class="num">${+i.estimado ? fh(+i.estimado) : '<span class="reg">—</span>'}</td></tr>`).join('') + `</table></div>`
    : '<div class="vacio">Nada.</div>');

/* Ficha de una issue de Jira: el mismo veredicto del cronograma (la fecha manda), tiempo, comentarios e
   historial, y dos propuestas que caen en «Cambios propuestos». El tablero NO escribe en Jira. */
function abrirIssueJira(clave) {
  const i = ((D.jira && D.jira.issues) || []).find((x) => x.clave === clave); if (!i) return;
  const comoItem = { id: i.clave, titulo: i.titulo, horas: i.estimado, trabajado: i.trabajado, ini: i.inicio, fin: i.fin, vence: i.fin, estado: i.estado, vencida: !!i.fin && i.fin < D.corte };
  const v = i.fin ? veredicto(comoItem) : { n: 'na', t: 'Sin fecha de vencimiento', d: 'No se puede saber si va a tiempo. Ponerle fecha es lo primero.' };
  const ajeno = !i.persona ? '<span class="ajeno">sin responsable</span>' : enCelula(i.persona) ? '' : '<span class="ajeno">no es de tu célula</span>';
  const url = i.url || (D.jira.sitio ? `https://${D.jira.sitio}/browse/${i.clave}` : '');
  const estados = [...new Set((D.jira.issues || []).map((x) => x.estado).filter(Boolean))].sort();
  const cs = i.comentarios || [], hs = i.historial || [];
  abrirDlg(`${i.clave} · ${i.titulo}`,
    `<div id="isV" class="ver ${v.n}"><b>${esc(v.t)}</b><span>${esc(v.d)}</span></div>` +
    `<h4 class="sub">Seguimiento</h4><dl class="kv" id="isDatos">

      <dt>Proyecto</dt><dd>${esc(i.proyecto_nombre || i.proyecto || '—')}</dd>
      ${i.tipo ? `<dt>Tipo</dt><dd>${esc(i.tipo)}</dd>` : ''}
      <dt>Estado</dt><dd>${esc(i.estado || '—')}</dd>
      <dt>Fecha de inicio</dt><dd>${i.inicio ? fdm(i.inicio) + '/' + i.inicio.slice(0, 4) : '—'}</dd>
      <dt>Vencimiento</dt><dd>${i.fin ? fdm(i.fin) + '/' + i.fin.slice(0, 4) : '<span class="reg">sin fecha</span>'}</dd>
      ${i.creado ? `<dt>Creada</dt><dd>${fdm(i.creado)}/${i.creado.slice(0, 4)}</dd>` : ''}
      ${i.actualizado ? `<dt>Últ. actualización</dt><dd>${fdm(i.actualizado)}/${String(i.actualizado).slice(0, 4)}</dd>` : ''}

    `<h4 class="sub">Historial</h4><div class="hist" id="isHist">${hs.length ? hs.slice(0, 40).map((h) => `<div><span class="pc">${esc(h.fecha)}</span> <b>${esc(h.campo)}</b>: ${esc(h.de || '—')} → ${esc(h.a || '—')} <span class="pc">· ${esc(h.autor)}</span></div>`).join('') : `<div class="vacio" style="padding:0">No incluido en esta lectura${url ? ': está completo en Jira' : ''}.</div>`}</div>` +
    `<h4 class="sub">Proponer un cambio (queda en «Cambios propuestos»; no se escribe en Jira)</h4>
      <div class="prop"><div class="form-row"><label for="isEstado">Cambiar estado a</label><select id="isEstado">${estados.map((e) => `<option ${e === i.estado ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select></div><button class="btn" id="isAplicaEstado">Proponer</button></div>
      <div class="prop" style="margin-top:8px"><div class="form-row"><label for="isComentario">Comentar</label><textarea id="isComentario" placeholder="Lo que hay que decirle al responsable o dejar escrito en la issue…"></textarea></div><button class="btn" id="isAplicaCom">Proponer</button></div>`);
  const cerrar = () => { const d = $('dlg'); if (d.close) d.close(); else d.removeAttribute('open'); };
  $('isAplicaEstado').onclick = () => { const nuevo = $('isEstado').value; if (nuevo && nuevo !== i.estado) { registrar(`${i.clave} (${i.titulo}): estado ${i.estado} → ${nuevo}`); cerrar(); } };
  $('isAplicaCom').onclick = () => { const t = $('isComentario').value.trim(); if (t) { registrar(`${i.clave} (${i.titulo}): comentar «${t}»`); cerrar(); } };
}
$('jiraCuerpo').addEventListener('click', (e) => { const tr = e.target.closest('tr.clic'); if (tr && D.jira) abrirListaJira(tr); });
$('dlgB').addEventListener('click', (e) => { const t = e.target.closest('tr.tarea[data-k]'); if (t && !e.target.closest('a')) abrirIssueJira(t.dataset.k); });

// ── Frentes y backups (se mueven en la reunión de equipo, nunca como hecho consumado) ──
const frentesAcuerdo = () => (D.acuerdo_frentes && D.acuerdo_frentes.length ? D.acuerdo_frentes : (D.frentes || []).filter((f) => f.titular !== undefined || f.backup !== undefined));
frentesAcuerdo().forEach((f) => { f._o = { titular: f.titular, backup: f.backup }; });

$('frentesCuerpo').addEventListener('change', (e) => {
  const s = e.target.closest('select[data-fr]'); if (!s) return;
  const f = frentesAcuerdo().find((x) => x.clave === s.dataset.fr); if (!f) return;

// ── Timesheets del equipo ─────────────────────────────────────────────────────────
function pintarTs() {

    `<div class="tabla-w"><table id="tsTabla"><tr><th>Persona</th>${T.dias.map((d) => `<th class="tsd">${DNOM[dowOf(d)]} ${fdm(d)}</th>`).join('')}${(T.personas[0].semanas || []).map((s, k) => `<th class="num">Sem. ${k + 1}</th>`).join('')}</tr>` +
    T.personas.map((p, n) => `<tr class="clic" data-ts="${n}"><td>${esc(p.nombre)}${p.sin_leer ? ` <span class="pill a">${p.sin_leer} sin leer</span>` : ''}</td>` +
      p.dias.map((d) => `<td class="tsd ${d.estado}" data-e="${d.estado}" title="${esc(NOM[d.estado] + (d.horas ? ` · ${fh(d.horas)} h, ${fh(d.horas_jira)} con issue` : ''))}">${d.horas ? Math.round(d.horas_jira / d.horas * 100) + '%' : ''}</td>`).join('') +
      p.semanas.map((s) => `<td class="num"><span class="${clsP(s.pct_jira)}">${s.dias_reportados}/${s.dias_exigibles} · ${s.pct_jira == null ? '—' : s.pct_jira + ' %'}</span></td>`).join('') + `</tr>`).join('') + `</table></div>`;
}
$('tsCuerpo').addEventListener('click', (e) => {

  const sinIssue = p.dias.flatMap((d) => d.sin_jira.map((s) => Object.assign({ fecha: d.fecha }, s))).sort((a, b) => b.horas - a.horas);
  const hSin = sinIssue.reduce((a, s) => a + s.horas, 0);
  abrirDlg(`Qué hizo ${p.nombre}`, (sinIssue.length ? `<div class="aviso" id="tsSinJira"><b>${fh(hSin)} h sin issue en la ventana</b> (las más grandes primero)<ul>${sinIssue.slice(0, 8).map((s) => `<li>${fdm(s.fecha)} · ${esc(s.tarea || 'sin descripción')} · ${fh(s.horas)} h</li>`).join('')}</ul></div>` : '') +
    (dias.length ? dias.map((d) => `<div class="card" style="margin-bottom:8px"><h2>${DNOM[dowOf(d.fecha)]} ${fdm(d.fecha)}<span class="n">${fh(d.horas)} h · ${Math.round(d.horas_jira / d.horas * 100)} % con issue</span></h2>` +
    d.actividades.map((a) => `<div class="item ${espera(a.tarea) ? 'mal' : ''}">${a.jira ? `<b>${esc(a.jira)}</b> · ` : '<span class="reg">sin issue</span> · '}${esc(a.tarea)} <span class="meta">${fh(a.horas)} h</span></div>`).join('') + `</div>`).join('')
    : '<div class="vacio">Sin horas reportadas en la ventana.</div>'));
});

// ── Arranque ──────────────────────────────────────────────────────────────────────
pintarCobertura(); resumen(); pintar(); pintarPendientes(); pintarMesa(); pintarLider(); pintarJira(); pintarFrentes(); pintarTs();
setVista(ls.get('vista', 'crono'));
$('pie').textContent = `Generado con el corte ${D.corte}. Archivo local y privado. El tablero no escribe en Jira: los cambios se copian y se aplican aparte, con confirmación.`;
</script>
