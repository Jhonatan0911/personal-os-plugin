<title>__TITULO_HTML__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Cronograma de historias a la izquierda/arriba, panel de la historia seleccionada a la derecha/abajo; vinotinto = pendiente de definición. */
:root{
  --bg:#FFFFFF; --panel:#F1F5F9; --card:#FFFFFF; --ink:#222222; --muted:#5A6275; --soft:#9CA3AF; --line:#E2E8F0;
  --brand:#2B3240; --deep:#2B3240; --action:#3D5A80; --mid:#56708F; --onb:#FFFFFF;
  --ok:#2A6349; --ok-bg:#E1EFE7; --warn:#B26B00; --warn-bg:#FBEFD9; --crit:#A8322D; --crit-bg:#F6E3E2;
  --vino:#7B1E2E; --vino-bg:#F5E4E7; --prop:#E8EEF8; --today:#FFF6D6;
  --f-body:"Segoe UI",system-ui,-apple-system,Arial,sans-serif; --f-mono:Consolas,"Cascadia Mono",ui-monospace,monospace;
  --colw:46px; --lab:250px;
  --band-sub:#D6DAE0; --ph-pru:#6B7686; --shade-rgb:15,18,24;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15171B; --panel:#1C1F24; --card:#22262C; --ink:#E7E9EC; --muted:#A6ABB3; --soft:#71777F; --line:#30353D;
  --brand:#2A2F37; --deep:#D6DAE0; --action:#6F8DB5; --mid:#7891B0;
  --ok:#6CC097; --ok-bg:#16322A; --warn:#E3A847; --warn-bg:#3A2E17; --crit:#E07A74; --crit-bg:#3A1F25;
  --vino:#E58A9A; --vino-bg:#3A1A22; --prop:#262C35; --today:#2B2A1F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15171B; --panel:#1C1F24; --card:#22262C; --ink:#E7E9EC; --muted:#A6ABB3; --soft:#71777F; --line:#30353D;
  --brand:#2A2F37; --deep:#D6DAE0; --action:#6F8DB5; --mid:#7891B0;
  --ok:#6CC097; --ok-bg:#16322A; --warn:#E3A847; --warn-bg:#3A2E17; --crit:#E07A74; --crit-bg:#3A1F25;
  --vino:#E58A9A; --vino-bg:#3A1A22; --prop:#262C35; --today:#2B2A1F; color-scheme:dark}
/* Marca opcional (generar_cronograma.py --marca): sobrescribe las variables de arriba; sin marca queda neutra */
/*__MARCA_CSS__*/
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--action);outline-offset:2px}
.band{background:var(--brand);color:#fff}
.band .in{padding:14px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.band img{height:26px;width:auto;display:block}
.band h1{margin:4px 0 0;font-size:21px;text-wrap:balance}
.band .sub{color:var(--band-sub);font-size:13px}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--card);border-radius:6px;padding:6px 11px}
.btn.pri{background:var(--action);border-color:var(--action);color:#fff}
.band .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.band .btn.pri{background:#fff;color:var(--brand);border-color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:3px 8px;font-size:12.5px}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--panel);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.crit{background:var(--crit-bg);color:var(--crit)}
.pill.vino{background:var(--vino);color:#fff} .pill.vline{background:transparent;border:1.5px solid var(--vino);color:var(--vino)}
.kpis{display:flex;flex-wrap:wrap;gap:6px 18px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.kpis b{color:var(--ink);font-variant-numeric:tabular-nums} .kpis .v b{color:var(--vino)} .kpis .c b{color:var(--crit)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:0;min-height:calc(100vh - 130px)}
@media (max-width:980px){.layout{grid-template-columns:minmax(0,1fr);min-height:0}.gwrap{border-right:0;border-bottom:1px solid var(--line)}.gscroll{max-height:65vh}}
@media (max-width:640px){:root{--lab:132px;--colw:34px}.band h1{font-size:18px}.band .sub{font-size:12px}.acts{width:100%}.acts .btn{flex:1 1 auto}
  .rl{padding:5px 6px 5px 8px}.rl .t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;font-size:12px}.rl .m .pill{font-size:11px;padding:0 6px}
  .bar{font-size:10.5px;padding:3px 4px}.kpis{font-size:12px;gap:4px 12px}.legend{font-size:11.5px}
  .it input[type=date]{width:100%}.it .r2>*{flex:1 1 auto}.modal{padding:12px}}
.gwrap{min-width:0;border-right:1px solid var(--line);display:flex;flex-direction:column}
.gscroll{overflow:auto;flex:1}
.grid{display:grid;grid-template-columns:var(--lab) repeat(var(--nd),var(--colw));min-width:max-content}
.ph{position:sticky;top:0;z-index:4;font-size:11px;text-align:center;padding:3px 2px;color:#fff;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.dev{background:var(--action)} .ph.qa{background:var(--mid)} .ph.pru{background:var(--ph-pru)} .ph.hol{background:var(--muted)} .ph.ali{background:var(--ok)}
.ph.corner{left:0;z-index:5;background:var(--deep);color:var(--bg);text-align:left;padding-left:10px}
.dh{position:sticky;top:20px;z-index:3;background:var(--deep);color:var(--bg);font-size:11px;text-align:center;padding:3px 0;border-left:1px solid rgba(255,255,255,.12)}
.dh b{display:block;font-size:12.5px}.dh.today{background:var(--action)}.dh.fest{background:var(--soft)}
.dh.corner{left:0;z-index:5;text-align:left;padding-left:10px}
.grid.dos .dh{top:40px}

.ph.gap{background:var(--panel)}
.ph.gap.r2{top:20px}

.ph.corner.rep{left:0;z-index:5;text-align:left;padding-left:10px}
.rl{position:sticky;left:0;z-index:2;background:var(--card);border-top:1px solid var(--line);padding:6px 8px 6px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0}
.rl .k{font-family:var(--f-mono);font-size:12px;color:var(--mid)} .rl .t{font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rl .m{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.mv{display:inline-flex;gap:2px}.mv .btn{padding:0 6px;font-size:10px;line-height:16px}
.rl.sel{box-shadow:inset 4px 0 0 var(--action);background:var(--panel)}
.rl.vino{box-shadow:inset 4px 0 0 var(--vino)} .rl.vino.sel{box-shadow:inset 4px 0 0 var(--vino),inset 0 0 0 1px var(--vino)}
.lane{grid-column:2 / -1;position:relative;border-top:1px solid var(--line);min-height:48px;cursor:pointer;
  background-image:linear-gradient(to right,var(--line) 1px,transparent 1px);background-size:var(--colw) 100%}
.lane.sel{background-color:color-mix(in srgb,var(--action) 6%,transparent)}
.lane .tc{position:absolute;top:0;bottom:0;width:var(--colw);background:var(--today);pointer-events:none}
.lane .fc{position:absolute;top:0;bottom:0;width:var(--colw);background:color-mix(in srgb,var(--soft) 18%,transparent);pointer-events:none}
.bar{position:absolute;top:9px;height:30px;border-radius:5px;font-size:11.5px;line-height:16px;padding:3px 7px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#fff;background:var(--action)}
.bar.enjira{background:var(--ok)}
.bar.otro{background:repeating-linear-gradient(135deg,var(--mid) 0 8px,color-mix(in srgb,var(--mid) 70%,#fff) 8px 16px)}
.hint{position:absolute;left:8px;font-size:12px;color:var(--soft);white-space:nowrap}
.bar.mix{background:linear-gradient(90deg,var(--action) 0 60%,var(--prop) 60%);color:#fff}
.bar.vino{background:repeating-linear-gradient(135deg,var(--vino-bg) 0 7px,color-mix(in srgb,var(--vino) 22%,var(--vino-bg)) 7px 14px);color:var(--vino);border:1.5px solid var(--vino)}
.bar .x{font-family:var(--f-mono);font-weight:600}
.load{grid-column:2 / -1;display:grid;grid-template-columns:repeat(var(--nd),var(--colw));border-top:2px solid var(--line)}
.lc{font-family:var(--f-mono);font-size:11px;text-align:center;padding:4px 0;border-left:1px solid var(--line)}
.lc.lo{background:var(--warn-bg);color:var(--warn)}.lc.full{background:var(--ok-bg);color:var(--ok)}.lc.over{background:var(--crit-bg);color:var(--crit);font-weight:700}.lc.none{color:var(--soft)}
.ll{position:sticky;left:0;z-index:2;background:var(--card);border-top:2px solid var(--line);font-size:12px;color:var(--muted);padding:4px 10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);padding:8px 10px;border-top:1px solid var(--line)}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
aside{min-width:0;display:flex;flex-direction:column;background:var(--bg)}
.side{padding:14px max(16px,env(safe-area-inset-right,0px)) 30px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;overflow:auto}
.side h2{margin:0;font-size:17px;color:var(--deep);text-wrap:balance}
.side h2 .k{font-family:var(--f-mono);color:var(--mid);font-size:14px;margin-right:6px}
.side h3{margin:4px 0 0;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.esc{font-size:12px;padding:1px 8px;border-radius:99px;white-space:nowrap}
.esc.ok{background:var(--ok-bg);color:var(--ok)} .esc.dif{border:1.5px solid var(--vino);color:var(--vino)} .esc.nueva{background:var(--vino);color:#fff}
.note{background:var(--panel);border-radius:6px;padding:8px 10px;font-size:13px}
.note.vino{border-left:4px solid var(--vino)}
.it{border:1px solid var(--line);border-radius:8px;padding:8px;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;background:var(--card)}
.it.propuesta{border-style:dashed;border-color:var(--mid)} .it.espera{border-color:var(--vino);background:var(--vino-bg)} .it.descartada{opacity:.5}
.it.creada{border-color:var(--ok)}
.it .r1{display:flex;gap:6px;align-items:center}
.it .r1 input{flex:1;min-width:0}
.it .r2{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.it input,.it select,textarea{border:1px solid var(--line);border-radius:5px;padding:4px 6px;background:var(--bg);min-width:0}
.it input[type=number]{width:62px} .it input[type=date]{width:132px}
.it .r3{display:flex;flex-wrap:wrap;gap:5px}
textarea{width:100%;min-height:68px;resize:vertical}
.obs{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--vino);font-weight:600}
.obs textarea{min-height:52px;font-weight:400;color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.empty{color:var(--muted);font-size:13px}
.jlist{font-size:12.5px;display:flex;flex-direction:column;gap:3px}
a{color:var(--action)}
.overlay{position:fixed;inset:0;background:rgba(var(--shade-rgb),.45);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--card);border-radius:10px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal h2{margin:0;font-size:17px;color:var(--deep)}
.op{display:flex;gap:8px;align-items:flex-start;font-size:13px;border-top:1px solid var(--line);padding-top:6px}
.op .res{margin-left:auto;font-size:12px;white-space:nowrap}
.modal.wide{max-width:900px}
.op.opx{flex-direction:column;align-items:stretch;gap:5px}
.opl{display:flex;gap:8px;align-items:flex-start}
.opx>.res{margin-left:0;white-space:normal}
textarea.dsc{width:100%;min-height:150px;font:12.5px/1.45 ui-monospace,Consolas,monospace;resize:vertical;box-sizing:border-box}
details.desc{font-size:12px}
details.desc summary{cursor:pointer;color:var(--deep);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
details.desc[open] summary{margin-bottom:5px}
details.desc .row{margin-top:4px}
.res.ok{color:var(--ok)} .res.bad{color:var(--crit)}
.ro{font-size:12px;color:var(--warn)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="band"><div class="in">
  <div>__LOGO_HTML__<h1>__TITULO_HTML__</h1>
    <div class="sub">__SUBTITULO_HTML__</div></div>
  <div class="acts"><span class="pill" id="jstat">Jira: sin consultar</span><span class="pill" id="sstat">Guardado: conectando…</span><button class="btn" id="bBackup" title="Descargar o copiar todo lo planeado como respaldo">Respaldo</button><button class="btn pri" id="bExport">Cambios para Jira</button></div>
</div></div>
<div class="kpis" id="kpis"></div>
<div class="layout">
  <section class="gwrap" aria-label="Cronograma">
    <div class="gscroll"><div class="grid" id="grid"></div></div>
    <div class="legend">
      <span><i class="sw" style="background:var(--action)"></i>Subtareas aceptadas</span>
      <span><i class="sw" style="background:var(--ok)"></i>Ya creada en Jira</span>
      <span>Las propuestas de Claude no se pintan hasta que las aceptes</span>
      <span><i class="sw" style="background:var(--vino)"></i>Pendiente de definición (lo define __QUIEN_DEFINE_HTML__)</span>
      <span id="leyCarga">Fila de carga: horas de desarrollo por día</span>
    </div>
  </section>
  <aside aria-label="Historia seleccionada"><div class="side" id="side"></div></aside>
</div>
<div id="modal"></div>

<script>
(function(){
"use strict";
const CFG=__CFG__;
const J=CFG.jira||{};
const CLOUD=J.cloud_id||"", SERVER=J.servidor_mcp||"Atlassian Rovo", SITIO=String(J.sitio||"").replace(/^https?:\/\//,"").replace(/\/+$/,""),
  TIPO_SUB=J.tipo_subtarea||"Subtarea", CAMPO_INI=J.campo_inicio||null, DUENO_CTA=(CFG.asignado&&CFG.asignado.accountId)||null,
  PROYECTO=CFG.proyecto, FIN_DEV=CFG.fin_desarrollo, DESC_SUB=CFG.descripcion_subtarea, LIDER=CFG.lider||"el líder",
  CAP_LJ=Number(CFG.capacidad[0]), CAP_V=Number(CFG.capacidad[1]);
const urlIssue=k=>SITIO?"https://"+SITIO+"/browse/"+encodeURIComponent(k):"";
const FEST=new Set(CFG.festivos||[]);
const PHASES=CFG.fases;
const PHASES2=CFG.fases_replan||[]; // fases replaneadas (rojo), debajo de las del cliente para no perder lo prometido
const DAYS=[];(function(){const d=new Date(CFG.inicio+"T12:00:00");const e=new Date(CFG.fin+"T12:00:00");while(d<=e){if(d.getDay()>0&&d.getDay()<6)DAYS.push(iso(d));d.setDate(d.getDate()+1);}})();
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
const TODAY=iso(new Date());
const DN=["dom","lun","mar","mié","jue","vie","sáb"];
function di(s){if(!s)return -1;let i=DAYS.indexOf(s);if(i>=0)return i;for(let k=0;k<DAYS.length;k++)if(DAYS[k]>=s)return k;return DAYS.length-1;}
function jor(s){if(FEST.has(s))return 0;return new Date(s+"T12:00:00").getDay()===5?CAP_V:CAP_LJ;}
function fmt(s){if(!s)return"—";const p=s.split("-");return p[2]+"/"+p[1];}
function h(n){return(Math.round(n*10)/10).toString().replace(".",",");}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
const $=id=>document.getElementById(id);
let uid=0; const nid=()=>"n"+Date.now().toString(36)+(uid++);

// Propuesta de Claude. El líder la acepta, la cambia o la descarta.
const P=(t,h,a,b,e)=>({titulo:t,horas:h,ini:a||null,fin:b||null,estado:e||"propuesta",autor:"claude"});
const PO=(t,h,a,b,o)=>Object.assign(P(t,h,a,b),{obs:o});
const W=(t,h,o)=>({titulo:t,horas:h,ini:null,fin:null,estado:"espera",autor:"claude",obs:o||""});
const ONEW=CFG.texto_nueva;
const HUS=CFG.historias;
// Orden: por clave (= orden de creación en Jira); el dueño lo cambia con las flechas y queda en db `orden/actual`
const cmpKey=(a,b)=>{const [pa,na]=a.split("-"),[pb,nb]=b.split("-");return pa===pb?(+na)-(+nb):(pa<pb?-1:1);};
let KEYS=HUS.map(x=>x.key).sort(cmpKey);
function aplicarOrden(lista){const vis=(lista||[]).filter(k=>HMAP[k]);KEYS=vis.concat(KEYS.filter(k=>!vis.includes(k)).sort(cmpKey));}
const HMAP=Object.fromEntries(HUS.map(x=>[x.key,x]));

// ---- Estado ----
const ST={}; // key -> {items, comentarios, transicion}
function defaults(hu){return{items:hu.items.map(it=>Object.assign({id:nid(),jira:null},it)),comentarios:hu.coment?[{id:nid(),texto:hu.coment,enviado:null,aceptado:false,autor:"claude"}]:[],transicion:null};}
HUS.forEach(hu=>ST[hu.key]=defaults(hu));
let SEL=KEYS[0], db=null, canWrite=false, LIVE={}, SUBS={}, mcp=null, sample=null, EXPD=null;
const saveTimers={}, INFLIGHT={};
// Nunca redibujar el panel mientras se escribe en él: borraría lo que no se ha guardado
function editando(){const a=document.activeElement;return !!(a&&a.closest&&(a.closest("#side")||a.closest("#modal"))&&a.matches("input,textarea,select"));}
function softRender(){renderKpis();renderGrid();if(!editando())renderSide();}
function save(key){ if(!db||!canWrite)return; clearTimeout(saveTimers[key]); saveTimers[key]=setTimeout(()=>{ saveTimers[key]=null; INFLIGHT[key]=true; db.collection("plan").doc(key).set(JSON.parse(JSON.stringify(Object.assign({},ST[key],{actualizado:new Date().toISOString()})))).finally(()=>{INFLIGHT[key]=false;}).then(()=>{$("sstat").textContent="Guardado";$("sstat").className="pill ok";}).catch(e=>{$("sstat").textContent="No se guardó: "+(e&&e.code||"error");$("sstat").className="pill crit";}); },500); }

// ---- Cálculos ----
const vivo=it=>it.estado!=="descartada"&&it.estado!=="espera";
function huHoras(k){let a=0,p=0,w=0;ST[k].items.forEach(it=>{const n=Number(it.horas)||0;if(it.estado==="aceptada"||it.jira)a+=n;else if(it.estado==="propuesta")p+=n;else if(it.estado==="espera")w+=n;});return{a,p,w};}
function huVino(k){const x=huHoras(k);return x.w>0&&x.w>=x.a+x.p;}
// ---- Responsable por subtarea: por defecto el dueño del cronograma; otra persona no suma a su carga ----
const MAIN=CFG.asignado.nombre, GENTE=CFG.personas||[], CUENTAS=Object.assign({},CFG.cuentas||{},DUENO_CTA?{[MAIN]:DUENO_CTA}:{});
const esMain=n=>n===MAIN||String(n).startsWith(MAIN+" ")||MAIN.startsWith(String(n)+" ");
const respOf=it=>(it.resp&&it.resp.nombre&&!esMain(it.resp.nombre))?it.resp:null;
// ---- Capacidad real (CFG.equipo, de fuentes.yaml): quien no produce PR o está prestado no tiene capacidad ese día. Sin equipo, igual que siempre ----
const EQUIPO=CFG.equipo||[];
const mismo=(a,b)=>{a=String(a||"");b=String(b||"");return !!a&&!!b&&(a===b||a.startsWith(b+" ")||b.startsWith(a+" "));};
const fichaDe=n=>EQUIPO.find(p=>mismo(p.nombre,n))||null;
const prestadoEn=(n,d)=>{const p=fichaDe(n),x=p&&p.prestado;return !!(x&&x.desde&&d>=x.desde&&(!x.hasta||d<=x.hasta));};
const sinPR=n=>{const p=fichaDe(n);return !!(p&&p.produce_pr===false);};
function jorDe(n,d){return sinPR(n)||prestadoEn(n,d)?0:jor(d);}
function equipoKpi(){
  if(!EQUIPO.length)return "";
  const dias=DAYS.filter(d=>d<=FIN_DEV&&jor(d)>0);const notas=[];let n=0;
  EQUIPO.forEach(p=>{if(p.produce_pr===false){notas.push(p.nombre+" no produce PR");return;}
    const fuera=dias.filter(d=>prestadoEn(p.nombre,d)).length;
    if(dias.length&&fuera===dias.length){notas.push(`${p.nombre}: prestada a ${p.prestado.a} desde ${fmt(p.prestado.desde)}`);return;}

// Reparto real por día: cada subtarea toma la capacidad que queda desde su inicio y lo que no cabe pasa al día siguiente (no se duplica)
function reparto(){
  const cap=DAYS.map(d=>jorDe(MAIN,d)), por={}, sobra={};
  const orden=[];KEYS.forEach((k,ki)=>ST[k].items.forEach((it,ii)=>{if(enCarga(it))orden.push({k,it,ki,ii});}));
  orden.sort((a,b)=>(a.it.ini<b.it.ini?-1:a.it.ini>b.it.ini?1:a.ki-b.ki||a.ii-b.ii));
  orden.forEach(({it})=>{let r=Number(it.horas)||0;const m={};for(let i=Math.max(0,di(it.ini));i<DAYS.length&&r>1e-9;i++){const t=Math.min(r,cap[i]);if(t>0){cap[i]-=t;m[i]=t;r-=t;}}
    por[it.id]=m;if(r>1e-9)sobra[it.id]=r;});
  const load=DAYS.map((d,i)=>jorDe(MAIN,d)-cap[i]);return{por,sobra,load};}
// Programar en secuencia desde una fecha: en el orden de las historias y de sus subtareas, llenando la capacidad diaria y arrastrando lo que no cabe
function programar(desde){
  const tocadas=new Set(), cal={};
  const quien=it=>respOf(it)?respOf(it).nombre:MAIN;
  KEYS.forEach(k=>ST[k].items.forEach(it=>{if(it.estado!=="aceptada"||it.jira)return;
    const p=quien(it);if(!cal[p])cal[p]={cap:DAYS.map(d=>jorDe(p,d)),i:Math.max(0,di(desde))};const c=cal[p];
    let r=Number(it.horas)||0,ini=null,fin=null;
    while(c.i<DAYS.length&&c.cap[c.i]<=1e-9)c.i++;
    let i=c.i;while(r>1e-9&&i<DAYS.length){const t=Math.min(r,c.cap[i]);if(t>0){if(ini===null)ini=i;fin=i;c.cap[i]-=t;r-=t;}if(c.cap[i]<=1e-9)i++;}
    c.i=Math.min(i,DAYS.length-1);
    if(ini===null){ini=fin=DAYS.length-1;}
    const a=DAYS[ini],b=DAYS[fin];if(it.ini!==a||it.fin!==b){it.ini=a;it.fin=b;tocadas.add(k);}}));
  return tocadas;}

const CACHE_CTA={};
async function cuentaDe(it){const o=respOf(it);if(!o){if(DUENO_CTA)return DUENO_CTA;o={nombre:MAIN};}if(o.accountId)return o.accountId;
  const norm=s=>String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
  const pal=norm(o.nombre).split(/\s+/).filter(Boolean);
  if(CACHE_CTA[o.nombre])return(o.accountId=CACHE_CTA[o.nombre]);
  const r=await mcp.callTool(SERVER,"searchJiraIssuesUsingJql",{cloudId:CLOUD,jql:"assignee is not EMPTY AND updated >= -180d ORDER BY updated DESC",fields:["assignee"],maxResults:100,responseContentFormat:"markdown"});
  const ns=(r.payload&&r.payload.issues&&r.payload.issues.nodes)||[];
  for(const n of ns){const a=n.fields&&n.fields.assignee;if(a&&a.accountId&&pal.every(p=>norm(a.displayName).includes(p))){CACHE_CTA[o.nombre]=a.accountId;o.accountId=a.accountId;return a.accountId;}}
  throw{code:"tool_error",message:`no encontré a «${o.nombre}» entre los responsables de Jira de los últimos 6 meses; escribe su nombre como aparece en Jira`};}

async function redactarDesc(k,it,signal){

Reglas:
- Una subtarea aceptada y con horas ya no tiene nada pendiente: NO escribas «Por confirmar», «pendiente de definir», preguntas ni opciones. Si el borrador trae algo así, quítalo. Lo único permitido es una dependencia de orden con otra subtarea («necesita el script de PROY-142»).

Markdown en español, sin títulos de nivel 1, máximo unas 150 palabras, con estas secciones:

**Qué hacer** — de 2 a 6 pasos técnicos numerados.

CONTEXTO: ${JSON.stringify(ctxSub(k,it))}
EXPEDIENTE: ${JSON.stringify(expRel()).slice(0,60000)}`;
  const {text}=await sample([{role:"user",content:prompt}],{signal,modelTier:"complex",cache:false});

        const quien=await cuentaDe(o.it);
        const r=await mcp.callTool(SERVER,"createJiraIssue",{cloudId:CLOUD,projectKey:PROYECTO,issueTypeName:TIPO_SUB,parent:o.k,assignee_account_id:quien,summary:o.it.titulo,contentFormat:"markdown",description:o.it.desc+pieDesc(o.k,o.it),additional_fields:add,responseContentFormat:"markdown"});
        const p=r.payload; let key=p&&p.issues&&p.issues.nodes&&p.issues.nodes[0]&&p.issues.nodes[0].key; if(!key){const m=JSON.stringify(p||r).match(/"key"\s*:\s*"([A-Z][A-Z0-9]+-\d+)"/);key=m&&m[1];}
        o.it.jira=key||"creada"; out.textContent=key||"creada"; out.className="res ok";
        const hc=horasClaude(o.k,o.it), hh=Number(o.it.horas)||0;
        EST.push({clave:key||null,historia:o.k,titulo:o.it.titulo,horas:hh,horas_claude:hc,ini:o.it.ini,fin:o.it.fin,responsable:respOf(o.it)?respOf(o.it).nombre:MAIN,tipo:o.it.tipo||null,fecha:TODAY,fuente:key||o.k});
        DEC.push({texto:hc!=null&&hc!==hh?`Aceptó «${o.it.titulo}» ajustando de ${h(hc)} a ${h(hh)} h (${key||"creada"})`:o.it.autor==="claude"?`Aceptó «${o.it.titulo}» con ${h(hh)} h (${key||"creada"})`:`Agregó «${o.it.titulo}» con ${h(hh)} h (${key||"creada"})`,fuente:key||o.k});
      }else if(o.tipo==="com"){
        await mcp.callTool(SERVER,"addCommentToJiraIssue",{cloudId:CLOUD,issueIdOrKey:o.k,commentBody:o.c.texto,contentFormat:"markdown"});
        o.c.enviado=new Date().toISOString(); out.textContent="publicado"; out.className="res ok";
        DEC.push({texto:`Comentó en ${o.k}: «${o.c.texto.slice(0,400)}${o.c.texto.length>400?"…":""}»`,fuente:o.k});
      }else{
        await mcp.callTool(SERVER,"transitionJiraIssue",{cloudId:CLOUD,issueIdOrKey:o.k,transition:{id:o.t.id}});
        o.t.aplicada=new Date().toISOString(); out.textContent="hecho"; out.className="res ok";
        DEC.push({texto:`Pasó ${o.k} a «${o.t.nombre}»`,fuente:o.k});
      }
      touched.add(o.k);
    }catch(e){out.textContent=errMsg(e);out.className="res bad";if(e&&(e.code==="needs_reauth"||e.code==="server_not_connected"||e.code==="not_in_manifest"||e.code==="approval_required"))break;}
  }
  touched.forEach(k=>save(k));
  if(DEC.length||EST.length)anotar(DEC,EST,`Exportado a Jira: ${EST.length} subtareas (${h(EST.reduce((s,e)=>s+e.horas,0))} h), ${DEC.length-EST.length} cambios más`);
  btn.textContent="Listo"; render();
  if(mcp&&mcp.invalidate)mcp.invalidate(SERVER,"searchJiraIssuesUsingJql").catch(()=>{});
}
function alertBox(t){$("modal").innerHTML=`<div class="overlay"><div class="modal"><div>${esc(t)}</div><div class="row" style="justify-content:flex-end"><button class="btn" onclick="this.closest('.overlay').remove()">Cerrar</button></div></div></div>`;}

// ---- Arranque ----
$("leyCarga").textContent=`Fila de carga: horas de desarrollo por día de ${MAIN} (${h(CAP_LJ)} h; viernes ${h(CAP_V)} h)`;
render();
(async()=>{
  const C=window.claude; if(!C||!C.use){$("sstat").textContent="Guardado: no disponible";$("jstat").textContent="Jira: no disponible";return;}
  const [dbx,user,m,smp,dls]=await Promise.all([C.use("db"),C.use("user"),C.use("mcp"),C.use("sample"),C.use("downloads")]);
  mcp=m; sample=smp; dl=dls; canWrite=!!(user&&user.isOwner&&user.isOwner()); db=dbx;
  if(db)db.collection("expediente").doc("actual").onSnapshot(s=>{const v=s&&s.data?s.data():null;EXPD=v?JSON.parse(JSON.stringify(v)):null;},()=>{});
  let first=true;
  if(db)db.collection("orden").doc("actual").onSnapshot(s=>{const v=s&&s.data?s.data():null;if(v&&Array.isArray(v.keys)){aplicarOrden(v.keys);renderGrid();}},()=>{});
  if(db){db.collection("plan").onSnapshot(snap=>{let changed=false;snap.docs.forEach(d=>{const v=d.data();
  if(!v||!HMAP[d.id]||saveTimers[d.id]||INFLIGHT[d.id]||(d.metadata&&d.metadata.hasPendingWrites))return;
  if(d.id===SEL&&editando())return; // la historia que se está editando no se pisa con lo remoto
  const remote=JSON.parse(JSON.stringify({items:v.items||[],comentarios:v.comentarios||[],transicion:v.transicion||null})); // el almacén entrega objetos congelados: se clonan para poder editarlos
  remote.items.forEach(x=>{if(!x.desc){const m=HMAP[d.id].items.find(y=>y.desc&&y.titulo===x.titulo);if(m)x.desc=m.desc;}}); // borradores del plan para lo guardado antes de que existieran
  if(JSON.stringify(remote)===JSON.stringify({items:ST[d.id].items,comentarios:ST[d.id].comentarios,transicion:ST[d.id].transicion}))return; // eco de nuestro guardado: no redibujar
  ST[d.id]=remote; changed=true;});$("sstat").textContent=canWrite?"Guardado":"Solo lectura";$("sstat").className="pill "+(canWrite?"ok":"");if(changed||first){first=false;softRender();}},()=>{$("sstat").textContent="Guardado: sin acceso";$("sstat").className="pill warn";});}
  else{$("sstat").textContent="Guardado: no disponible (inicia sesión)";$("sstat").className="pill warn";canWrite=false;}
  render();
  if(!mcp){$("jstat").textContent="Jira: no disponible";return;}
  const REALES=KEYS.filter(k=>!HMAP[k].ficticia); // una historia de ejemplo (aún sin crear en Jira) rompería la consulta
  if(!REALES.length||!CLOUD){$("jstat").textContent="Jira: "+(CLOUD?"sin historias reales":"sin cloud_id");return;}
  const jql="key in ("+REALES.join(",")+") OR parent in ("+REALES.join(",")+")";
  mcp.watchTool(SERVER,"searchJiraIssuesUsingJql",{cloudId:CLOUD,jql,fields:["summary","status","parent","timeoriginalestimate"],maxResults:100,responseContentFormat:"markdown"},ev=>{
    if(ev.type==="error"){const c=ev.error&&ev.error.code;$("jstat").textContent="Jira: "+(c==="needs_reauth"?"reconecta Atlassian":c==="server_not_connected"?"agrega el conector":c==="not_in_manifest"||c==="approval_required"?"falta tu permiso":"sin respuesta");$("jstat").className="pill warn";if(c==="needs_reauth"||c==="server_not_connected"||c==="not_in_manifest"){LIVE={};SUBS={};softRender();}return;}
    const nodes=(ev.result.payload&&ev.result.payload.issues&&ev.result.payload.issues.nodes)||[];
    const L={},S={};
    nodes.forEach(n=>{const f=n.fields||{};const st=(f.status&&f.status.name)||"";if(HMAP[n.key])L[n.key]={status:st};else if(f.parent&&HMAP[f.parent.key])(S[f.parent.key]=S[f.parent.key]||[]).push({key:n.key,summary:f.summary||"",status:st,est:f.timeoriginalestimate?f.timeoriginalestimate/3600:null});});
    LIVE=L;SUBS=S;
    const at=ev.result.cache?new Date(ev.result.cache.storedAt):new Date();
    $("jstat").textContent="Jira: "+String(at.getHours()).padStart(2,"0")+":"+String(at.getMinutes()).padStart(2,"0");$("jstat").className="pill ok";
    softRender(); // la consulta periódica a Jira no puede redibujar el panel con el cursor adentro
  },{refetchInterval:120000});
})();
})();
