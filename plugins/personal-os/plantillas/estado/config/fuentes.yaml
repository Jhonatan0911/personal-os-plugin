planeacion:
  capacidad_diaria: { lunes_a_jueves: 8, viernes: 8 }
  matriz_tiempos:                        # referencias cortas; la forma completa (niveles, familiaridad,
    componente_nuevo_con_logica: "1.5-3 h"   # tipos con base/rango) está en
    mostrar_dato_ya_calculado: "<= 1 h"      # skills/planear-sprint/matriz-tiempos-ejemplo.yaml del plugin
    refactor_o_traslado: "-30 % frente a la cifra a mano"
  niveles: ["junior", "semi", "senior"]
  # Opcionales de planear-sprint (detalle en skills/planear-sprint/references/configuracion.md):
  # matriz_archivo: "<stateDir>/config/estimaciones/matriz-tiempos.yaml"   # matriz completa (manda sobre matriz_tiempos)
  # perfil: "<stateDir>/config/perfil-planear-sprint.json"   # defaults del plan: jira, lider, quien_define, personas…
  # marca: "<stateDir>/config/marca/marca-cronograma.json"   # colores y logo del cronograma; sin ella sale neutro
  # carpeta_trabajo: "<stateDir>/estimaciones"              # plan.json, expediente.json y HTML por sprint
  # tablero_central: { url: "<url del artefacto>", coleccion: "cronogramas" }
  # mineria_dir: "<stateDir>/estimaciones/mineria"          # salidas de la calibración (privado)
  # minero_dir: "<carpeta con tus encargos o scripts del minero>"
  # catalogo_matriz_url: "<url de la página de la matriz>"
  # investigacion: "<documento con la base de las reglas de estimación>"

# Flujo del líder por niveles de caso (opcional; contrato en skills/planear-sprint/references/niveles.md).
# Sin esta sección, o con niveles_activos: false, todo caso recorre el flujo completo (pasos 0 a 6).
flujo:
  niveles_activos: false
  nivel_por_defecto: "C"
  niveles:
    A: { nombre: "Trámite o configuración", minutos_lider: "10-15", pasos: { p0: corto, p5: evidencia } }
    B: { nombre: "Bug o incidente", minutos_lider: "30-60", pasos: { p0: corto, p1: corto, p4: ia_y_humana, p5: evidencia, p6: corto } }
    C: { nombre: "Requerimiento o proyecto", minutos_lider: "120-180 al inicio + cortes",
         pasos: { p0: completo, p1: completo, p2: completo, p3: completo, p4: completo, p5: matriz, p6: completo } }
  clasifica: "lider"                    # lider | analista
  paso0: { quien_llena: "lider", analistas: [] }   # analistas: [{ nombre: "<corto>", clientes: ["Cliente A"] }]
  refutador: { completo_en: ["C"], corto_en: [] }
  entrada_solo_por_paso0: false         # true: un pedido que llega al desarrollador por correo vuelve al paso 0
  cierre_jira: null                     # estado al que pasa el caso al cerrar el paso 6

normas:
  jurisdicciones: ["CO"]                # el refutador solo cita reglas de estas jurisdicciones (CO, PE, …)

