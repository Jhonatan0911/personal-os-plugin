<template>
  <style>
    #root { position: absolute; inset: 0; font-family: "JetBrains Mono", monospace; color: #e6ecf7; }
    /* Terminal de Claude Code: entra al lado de la lista, objeto a objeto. */
    .t-win { position: absolute; left: 1040px; top: 150px; width: 784px; height: 786px; border-radius: 16px; overflow: hidden;
      background: #0b0f17; border: 2px solid rgba(120,150,200,.22); box-shadow: 0 30px 80px rgba(0,0,0,.55); }
    .t-chrome { height: 64px; display: flex; align-items: center; gap: 12px; padding: 0 26px; border-bottom: 1px solid rgba(120,150,200,.14);
      font-size: 26px; color: #8796ae; }
    .t-chrome i { width: 15px; height: 15px; border-radius: 50%; display: block; }
    .t-chrome span { margin-left: 14px; }
    .t-body { position: relative; padding: 28px 30px; height: 722px; }
    .t-nw { white-space: nowrap; }
    .t-hello { border: 2px solid rgba(217,119,87,.55); border-radius: 12px; padding: 18px 22px; }
    .t-hello b { display: block; font-size: 30px; font-weight: 700; }
    .t-hello b em { font-style: normal; color: #d97757; }
    .t-hello span { display: block; font-size: 26px; color: #8796ae; margin-top: 6px; }
    .t-msg { margin-top: 34px; font-size: 28px; line-height: 1.4; color: #b9c4d6; opacity: 0; }
    .t-msg em { font-style: normal; color: #8796ae; }
    .t-agent { margin-top: 26px; font-size: 28px; line-height: 1.4; opacity: 0; }
    .t-agent .dot { color: #35e0d0; }
    .t-agent b { font-weight: 700; color: #e6ecf7; }
    .t-sub { margin-top: 6px; font-size: 26px; color: #8796ae; padding-left: 34px; opacity: 0; }
    .t-prompt { position: absolute; left: 30px; right: 30px; bottom: 30px; min-height: 140px; border: 2px solid rgba(120,150,200,.35);
      border-radius: 12px; padding: 20px 22px; font-size: 28px; line-height: 1.45; display: block; padding-left: 62px; text-indent: -32px; }
    .t-prompt .pr { color: #8796ae; margin-right: 16px; }
    .t-typed { white-space: pre-wrap; word-break: normal; }
    .t-typed .ch { display: none; }
    .t-caret { display: inline-block; width: 15px; height: 32px; background: #e6ecf7; vertical-align: -6px; margin-left: 2px; }
  </style>
  <div id="root" data-composition-id="terminal" data-width="1920" data-height="1080">
    <div class="t-win" id="t-win">
      <div class="t-chrome" id="t-chrome">
        <i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i>
        <span>claude · ~/mi-proyecto</span>
      </div>
      <div class="t-body">
        <div class="t-hello" id="t-hello"><b><em>✻</em> Claude Code</b><span>cwd: ~/mi-proyecto</span></div>
        <div class="t-msg" id="t-msg"><em>&gt;</em> revisa el cambio del login con <span class="t-nw">revisor-de-codigo</span></div>
        <div class="t-agent" id="t-agent"><span class="dot" id="t-dot">●</span> <b>revisor-de-codigo</b>(Revisar el cambio del login)</div>
        <div class="t-sub" id="t-sub">└ Leyendo el diff del login…</div>
        <div class="t-prompt" id="t-prompt"><span class="pr">&gt;</span><span class="t-typed" id="t-typed">revisa el cambio del login con revisor-de-codigo</span><span class="t-caret" id="t-caret"></span></div>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // Parte el pedido en letras para escribirlo a 28 caracteres por segundo, en función del tiempo.
      const typed = document.getElementById("t-typed");
      const txt = typed.textContent;
      // Cada palabra en un bloque sin corte, para que «revisor-de-codigo» no se parta en el guion.
      typed.innerHTML = txt.split(" ").map((w, k, a) => '<span class="t-nw">' + w.split("").map((c) => '<span class="ch">' + c + "</span>").join("") + "</span>" + (k < a.length - 1 ? '<span class="ch"> </span>' : "")).join("");
      const chars = typed.querySelectorAll(".ch");

      const tl = gsap.timeline({ paused: true });
      // La ventana llega desde la derecha; luego cada objeto suyo.
      tl.fromTo("#t-win", { x: 120, opacity: 0, filter: "blur(10px)" }, { x: 0, opacity: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 0.05);
      tl.fromTo("#t-hello", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" }, 0.25);
      tl.fromTo("#t-prompt", { opacity: 0, scaleX: 0.92, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.5, ease: "expo.out" }, 0.38);
      const t0 = 0.5, cps = 28;
      chars.forEach((c, i) => tl.set(c, { display: "inline" }, t0 + i / cps));
      const tEnd = t0 + chars.length / cps;
      // Enter: el pedido sube al historial y aparece la línea del agente.
      tl.to("#t-typed, #t-caret", { opacity: 0, duration: 0.12, ease: "power3.in" }, tEnd + 0.12);
      tl.fromTo("#t-msg", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.15, ease: "power2.out" }, tEnd + 0.16);
      tl.fromTo("#t-agent", { opacity: 0, x: -14 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, tEnd + 0.3);
      tl.fromTo("#t-dot", { opacity: 1 }, { opacity: 0.3, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 7 }, tEnd + 0.5);
      tl.fromTo("#t-sub", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, tEnd + 0.5);
      // Sale (40 % más corta que la llegada).
      tl.to("#t-win", { x: 80, opacity: 0, filter: "blur(8px)", duration: 0.32, ease: "power3.in" }, 4.85);
      window.__timelines["terminal"] = tl;
    })();
  </script>
</template>
