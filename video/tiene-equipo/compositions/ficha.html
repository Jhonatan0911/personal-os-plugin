              <div class="f-empty" id="f-empty">Aún sin experiencias</div>

            <span class="f-chip of">Revisor de código</span>
            <span class="f-chip"><svg viewBox="0 0 24 24"><path d="M9 4a4 4 0 0 0-4 4 4 4 0 0 0-1 7 4 4 0 0 0 5 5V4zM15 4a4 4 0 0 1 4 4 4 4 0 0 1 1 7 4 4 0 0 1-5 5V4z" fill="#ff7ac6"/></svg>memoria</span>

  <script>
    (function () {
      const r = window.IdentidadAgente.svg({ nombre: "revisor-de-codigo", grupo: "mios", oficio: "Revisor de código", color: "blue", accesorio: "lupa" });
      document.getElementById("f-m").innerHTML = r.svg.replace(/osmg(\d+)/g, "frev$1");

      const tl = gsap.timeline({ paused: true });
      const M = "#f-m";
      
      // Morph: el contenedor de la tarjeta (60,200 · 900x118) se abre en la ficha.
      tl.fromTo("#f-pan", { clipPath: "inset(154px 180px 688px 0px round 16px)" },
        { clipPath: "inset(0px 0px 0px 0px round 16px)", duration: 0.85, ease: "power2.inOut" }, 0);
      // La mascota viaja de la tarjeta (88 px) a la cabecera (200 px), con su propia curva.
      tl.fromTo(M, { x: -26, y: 129, scale: 0.44 }, { x: 0, y: 0, scale: 1, duration: 0.85, ease: "power2.inOut" }, 0);
      tl.fromTo("#f-id > *:not(.f-state)", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.4, stagger: 0.08, ease: "expo.out" }, 0.55);
      tl.fromTo("#f-state", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.8);
      tl.fromTo("#f-lbl-lim", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 1.0);

      // Sigue trabajando: rebote cada 0.7 s y chispas, ciclos contados (11.9 s = 17 ciclos).
      tl.fromTo(M + " .cu", { y: 0 }, { y: -5, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 33 }, 0);
      tl.fromTo(M + " .chispa", { opacity: 0.4, scale: 0.7, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1.08, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 33 }, 0);
      tl.fromTo("#f-sdot", { opacity: 1 }, { opacity: 0.35, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 33 }, 0);
      // Parpadeos a tiempos fijos mientras lee.
      [2.4, 5.6, 8.9].forEach((t) => {
        tl.to(M + " .oj", { scaleY: 0.1, transformOrigin: "50% 50%", duration: 0.07, ease: "power2.in" }, t);
        tl.to(M + " .oj", { scaleY: 1, duration: 0.1, ease: "power2.out" }, t + 0.08);
      });

      // Título 1 y los límites, uno a uno.
      tl.fromTo("#f-t1 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, 1.2);
      ["#f-l1", "#f-l2", "#f-l3"].forEach((s, i) => tl.fromTo(s, { opacity: 0, x: -30, filter: "blur(6px)" },
        { opacity: 1, x: 0, filter: "blur(0px)", duration: 0.55, ease: "expo.out" }, 1.9 + i * 0.6));
      tl.to("#f-t1 span", { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.04, ease: "power3.in" }, 6.0);

      // MEMORIA: la ficha baja hasta la sección Memoria (la cabecera se queda).
      tl.to("#f-body", { y: -305, duration: 1.0, ease: "power2.inOut" }, 6.3);
      tl.fromTo("#f-t2 span", { opacity: 0, filter: "blur(6px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.13, stagger: 0.07, ease: "power2.out" }, 7.0);
      // Abre «Criterios de revisión del equipo» y resalta 3 líneas.
      tl.to("#f-know", { borderColor: "rgba(53,224,208,.7)", duration: 0.3, ease: "power2.out" }, 7.6);
      tl.fromTo("#f-lines", { height: 0 }, { height: 190, duration: 0.6, ease: "expo.out" }, 7.75);
      ["#f-p1", "#f-p2", "#f-p3"].forEach((s, i) => {
        tl.to(s, { backgroundColor: "rgba(53,224,208,.16)", color: "#e6ecf7", duration: 0.25, ease: "power2.out" }, 8.3 + i * 0.45);
      });
      // Cierra el archivo.
      tl.to("#f-lines", { height: 0, duration: 0.35, ease: "power3.in" }, 9.75);
      tl.to("#f-know", { borderColor: "rgba(120,150,200,.25)", duration: 0.3 }, 9.8);
      // En Experiencia aterriza la lección nueva, con el ✓ cian.
      tl.to("#f-empty", { opacity: 0, filter: "blur(6px)", duration: 0.15, ease: "power3.in" }, 10.1);
      tl.set("#f-empty", { display: "none" }, 10.26);
      tl.fromTo("#f-exp", { opacity: 0, y: -60, scale: 1.08, filter: "blur(8px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 0.6, ease: "expo.out" }, 10.26);
      tl.fromTo("#f-tick", { scale: 0, rotate: -60 }, { scale: 1, rotate: 0, duration: 0.45, ease: "back.out(1.6)" }, 10.55);
      tl.to("#f-t2 span", { opacity: 0, filter: "blur(8px)", duration: 0.16, stagger: 0.04, ease: "power3.in" }, 12.2);

      // La mascota se separa: el panel se va y ella queda sola para cruzar a la oficina.
      tl.to("#f-pan", { opacity: 0, filter: "blur(12px)", scale: 0.97, duration: 0.4, ease: "power3.in" }, 12.45);
      window.__timelines["ficha"] = tl;
    })();
  </script>
