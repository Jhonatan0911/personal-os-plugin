<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <!-- El mismo módulo que dibuja las mascotas en la consola; cada escena también lo carga. -->
    <script src="assets/identidad-agente.js"></script>
    <style>
      :root {
        --ground: #070b12;
        --ink: #e6ecf7;
        --font-display: "Inter", sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); }
      #root { width: 100%; height: 100%; position: relative; font-family: var(--font-display); }
      /* El suelo de la consola neuronal: los mismos tintes radiales que su plantilla real. */
      #ground {
        position: absolute; inset: 0;
        background:
          radial-gradient(1200px 700px at 78% -10%, rgba(76,155,255,.10), transparent 60%),
          radial-gradient(1000px 620px at 12% 8%, rgba(169,123,255,.09), transparent 60%),
          radial-gradient(900px 900px at 50% 120%, rgba(53,224,208,.06), transparent 55%),
          #070b12;
      }
      #lista { z-index: 1; }
      #terminal { z-index: 2; }
      #ficha { z-index: 1; }
      #oficina { z-index: 1; }
      #cierre { z-index: 1; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="36" data-width="1920" data-height="1080">
      <div id="ground"></div>
      <div id="lista" data-composition-id="lista" data-composition-src="compositions/lista.html"
        data-start="0" data-duration="11" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="terminal" data-composition-id="terminal" data-composition-src="compositions/terminal.html"
        data-start="3" data-duration="5.2" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="ficha" data-composition-id="ficha" data-composition-src="compositions/ficha.html"
        data-start="11" data-duration="13" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="oficina" data-composition-id="oficina" data-composition-src="compositions/oficina.html"
        data-start="24" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="cierre" data-composition-id="cierre" data-composition-src="compositions/cierre.html"
        data-start="30" data-duration="6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
